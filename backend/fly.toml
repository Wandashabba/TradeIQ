# Fly.io config for the TradeIQ backend.
#
# Region is lhr (London), chosen to sit beside the Supabase database in
# eu-west-1 (Ireland) — roughly 10ms apart. Co-locating the app and the
# database matters more than putting either near Johannesburg: one HTTP
# request makes several queries, so a split would pay the long hop repeatedly.
#
# Supabase has no African region, so ~170ms from a Gauteng phone is the floor
# for now. Fly has a jnb region; moving there is worth it only once the
# database can follow, otherwise it makes things worse rather than better.
#
# Secrets are NOT set here. Use `fly secrets set` so they live encrypted in
# Fly rather than in a committed file:
#   fly secrets set DATABASE_URL="..." JWT_SECRET="..." CORS_ORIGINS="..."

app = "tradeiq-backend"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# Applies migrations before any new version takes traffic. If it fails, the
# deploy aborts and the old version keeps serving — a broken migration should
# never become a broken site.
[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  PORT = "4000"
  NODE_ENV = "production"
  # The public origin, for links the API hands out (a run's csvUrl and signed
  # csvDownloadUrl, and the link in report emails, #66). Not a secret.
  # SMTP_* and REPORT_LINK_SECRET are secrets: see docs/operations/report-email.md.
  PUBLIC_API_URL = "https://tradeiq-backend.fly.dev"

[http_service]
  internal_port = 4000
  force_https = true
  # One machine always stays up (#160). An agent standing in a store should not
  # wait on a cold start, which is what `min_machines_running = 0` cost on the
  # first request after every quiet spell.
  #
  # Auto-stop and auto-start stay on, so any machine ABOVE the minimum still
  # idles down and comes back on demand — the floor is one, not "all of them".
  # The trade is cost: one shared-cpu-1x/512mb machine running 24/7 instead of
  # only while busy. See docs/operations/deploy-hardening.md.
  #
  # fly.toml only takes effect on the next `fly deploy`; editing this file
  # changes nothing on the live app by itself.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
