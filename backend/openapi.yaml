openapi: 3.0.3
info:
  title: TradeIQ API
  version: 0.1.0
  description: >
    Phase 1 scaffold. /auth and /outlets are fully implemented. All other
    module routes (/visits, /stock, /visibility, /pricing, /competitive,
    /capability, /risks, /tasks, /scorecards, /dashboard) currently return
    501 Not Implemented and will be filled in by follow-up plans — see
    docs/architecture/stubs-and-interfaces.md.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [field_agent, manager, admin] }
        '401':
          description: Invalid credentials
  /outlets:
    get:
      summary: List outlets for the authenticated user's client
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of outlets
          content:
            application/json:
              schema:
                type: array
        '401':
          description: Missing or invalid token
    post:
      summary: Create an outlet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, channelType, lat, lng, territoryId]
              properties:
                name: { type: string }
                code: { type: string }
                channelType: { type: string }
                lat: { type: number }
                lng: { type: number }
                territoryId: { type: string }
                teamProfile: { type: object }
      responses:
        '201':
          description: Outlet created
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required fields (name, code, channelType, lat, lng, territoryId)
        '401':
          description: Missing or invalid token
        '409':
          description: An outlet with this code already exists
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
