        contests that ended in the last 30 local days (most recent first).
        Never upcoming or cancelled contests. A field agent sees tenant-wide
        contests plus contests scoped to a territory they are assigned to;
        managers and admins see all of them, with `me: null`. Each contest
        carries the top 10 standings, the participant count and the caller's
        own row.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current contests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CurrentContest' } }
  /contests/{id}:
    get:
      summary: One contest — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Contest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contest' }
        '403': { description: Forbidden }
        '404': { description: Not found (or another client's contest) }
    patch:
      summary: Edit a contest — manager/admin
      description: >-
        Any subset of the create fields, at least one. Dates are checked against
        each other after merging with the stored ones. A cancelled contest
        cannot be edited.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContestPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contest' }
        '400': { description: Invalid body or dates out of order }
        '403': { description: Forbidden }
        '404': { description: Contest or territory not found }
        '409': { description: The contest is cancelled }
    delete:
      summary: Delete an upcoming or cancelled contest — manager/admin
      description: An active or ended contest cannot be deleted; cancel an active one instead.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '409': { description: The contest is active or ended }
  /contests/{id}/cancel:
    post:
      summary: Cancel an upcoming or active contest — manager/admin
