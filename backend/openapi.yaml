        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: interval, in: query, schema: { type: string, enum: [day, week] } }
        - { $ref: '#/components/parameters/TrendTerritoryId' }
      responses: { '200': { description: Time series }, '400': { description: Invalid params }, '403': { description: Forbidden } }
  /trends/availability:
    get:
      summary: On-shelf-availability % trend — manager/admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: interval, in: query, schema: { type: string, enum: [day, week] } }
        - { $ref: '#/components/parameters/TrendTerritoryId' }
      responses: { '200': { description: Time series }, '400': { description: Invalid params } }
  /trends/perfect-store:
    get:
      summary: Perfect-store (green scorecard) rate trend — manager/admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: interval, in: query, schema: { type: string, enum: [day, week] } }
        - { $ref: '#/components/parameters/TrendTerritoryId' }
      responses: { '200': { description: Time series }, '400': { description: Invalid params } }
  /trends/share-of-shelf:
    get:
      summary: Share-of-shelf % trend (own vs competitor facings) — manager/admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: interval, in: query, schema: { type: string, enum: [day, week] } }
        - { $ref: '#/components/parameters/TrendTerritoryId' }
      responses: { '200': { description: Time series }, '400': { description: Invalid params } }
  /trends/benchmark:
    get:
      summary: Cross-territory benchmark within the caller's client (#123) — manager/admin
      description: >-
        Every territory of the caller's client, each with its series and period
        average, against the client-wide series as the reference line. Outlets
        join territories by Outlet.territoryId = Territory.code. Buckets and
        territories with no data are absent or carry average null / count 0 —
        never a fabricated zero. For shareOfShelf only visits that captured
        facings are counted. Cross-client benchmarks are out of scope.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [perfectStore, availability, scorecards, shareOfShelf] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: interval, in: query, schema: { type: string, enum: [day, week] } }
      responses:
        '200':
          description: Territory benchmark
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerritoryBenchmarkReport' }
        '400': { description: 'Invalid metric, interval or date; or territoryId supplied' }
        '403': { description: Forbidden }
  # ── Phase 2 (Intelligence) ────────────────────────────────────────────────
  /fraud/visits/{visitId}:
    get:
      summary: Fraud risk score + signals for a visit — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: visitId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'Risk score + signals' }, '404': { description: Not found } }
  /fraud/visits/{visitId}/verdict:
    post:
      summary: Record the manager's ruling on a flagged visit — manager/admin (#392, #395)
      description: >
        A flagged visit is an accusation the engine made and a person has to answer.
        The ruling is INSERTed against a UNIQUE visit_id, never upserted: **201 once,
        409 ever after.** The second manager to press the button does not overwrite the
        first manager's decision — they lose at the database and are answered 409 with
        the standing verdict in the body, so they learn whose ruling applies instead of
        believing theirs took effect. The uniqueness IS the lock; there is no
        read-then-write window for two concurrent reviewers to slip through.


        The reviewer is taken from the bearer token and never from the body: a body that
        could name the reviewer is a body that lets one manager file a ruling under a
        colleague's name, and this row is the audit trail. `reviewerLabel` freezes their
        display name (or email) as it read at the time, so a rename or deactivation
        cannot rewrite or erase who decided.


        A ruled visit LEAVES the default `GET /fraud/flagged` queue — see that endpoint.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: visitId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              additionalProperties: false
              properties:
                verdict: { type: string, enum: [confirmed, dismissed, inconclusive] }
                note:
                  type: string
                  maxLength: 2000
                  description: Free text, trimmed. Blank or absent is stored and returned as null, never ''.
      responses:
        '201':
          description: The ruling was recorded; it now stands
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FraudVerdict' }
        '400':
          description: Unknown verdict, an over-long note, or an unrecognised field
        '401': { description: Missing or invalid token }
        '403': { description: Not a manager or admin }
        '404':
          description: >
            Visit not found for this client. 404 rather than 403 for another tenant's id,
            matching GET /fraud/visits/{visitId} — a 403 would confirm the id exists.
        '409':
          description: A verdict already stands on this visit; it is returned so the loser knows whose ruling applies
          content:
            application/json:
              schema:
                type: object
                required: [error, verdict]
                properties:
                  error: { type: string }
                  verdict: { $ref: '#/components/schemas/FraudVerdict' }
  /fraud/verdicts:
    get:
      summary: The tenant's fraud review ledger, newest decision first — manager/admin (#392)
      description: >
        The flagged queue answers "what still needs a person"; this answers "what did the
        people decide" — the question an audit, a dispute or a new manager's first week
        actually asks. Keyset-paged on (decidedAt desc, id desc); page with `nextCursor`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: '`nextCursor` from the previous page' }
      responses:
        '200':
          description: One page of verdicts
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/FraudVerdict' }
                        - type: object
                          required: [id]
                          properties:
                            id: { type: string, description: The verdict's own id, which is also this list's cursor }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Malformed limit or cursor }
        '401': { description: Missing or invalid token }
        '403': { description: Not a manager or admin }
  /fraud/attempts:
    get:
      summary: List check-in attempts (incl. rejected) — manager/admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: outletId, in: query, schema: { type: string } }
        - { name: agentId, in: query, schema: { type: string } }
        - { name: passed, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses: { '200': { description: Attempts } }
  /fraud/flagged:
    get:
      summary: Submitted visits whose stored fraud score is at or above a threshold, highest first — manager/admin
      description: >
        Reads the score stored on each visit at submit (and by `npm run rescore-fraud`),
        never computing it on read (#236). A stored score is a snapshot taken at
        `scoredAt`; signals that read history or the client's kpiThresholds do not
        change it until the visit is rescored. GET /fraud/visits/{visitId} is always
        live. Visits in the window without a stored score are excluded and counted
        in `unscored`. Ordered riskScore descending, then id descending; page with
        `nextCursor`.


        **BY DEFAULT THIS IS NOW THE OPEN QUEUE, AND THAT CHANGED WHAT AN UNCHANGED
        REQUEST RETURNS (#392).** A visit a manager has ruled on
        (POST /fraud/visits/{visitId}/verdict) LEAVES this list. Before verdicts existed
        the same twenty visits came back every morning, each manager re-reading the ones
        a colleague had already dismissed yesterday; a queue that never shortens is a
        queue people stop opening, and the flagged visit that mattered went unread among
        the ones already cleared. Nothing is hidden: `?reviewed=true` is the decided
        list, `?reviewed=all` is exactly the old behaviour, and every row carries its
        `verdict` (null = nobody has ruled) whichever side you ask for. `unscored` is
        filtered the same way, so the page and its counter describe one population.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: minScore, in: query, schema: { type: number, default: 50 }, description: 'Scores are whole numbers 0-100; a fraction rounds up' }
        - name: reviewed
          in: query
          schema: { type: string, enum: ['true', 'false', 'all'], default: 'false' }
          description: >
            Which side of the review line to answer about. Absent or `false` → only
            visits nobody has ruled on (the open queue, the default). `true` → only ruled
            visits. `all` → both, which is what this endpoint returned before #392.
            Anything else is a 400 rather than a silent fallback: a quietly ignored
            `reviewed=yes` would hand back the open queue to a caller who believed they
            were reading the decided one.
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'Check-in at or after. Default: 30 days before `to`' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'Check-in at or before. Default: now' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: '`nextCursor` from the previous page' }
      responses:
        '200':
          description: One page of flagged visits
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor, unscored, from, to]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [visitId, outletId, agentId, riskScore, signals, scoredAt, verdict]
                      properties:
                        visitId: { type: string }
                        outletId: { type: string }
                        agentId: { type: string }
                        riskScore: { type: integer, minimum: 0, maximum: 100 }
                        signals:
                          type: array
                          items:
                            type: object
                            properties:
                              code: { type: string }
                              detail: { type: string }
                              weight: { type: integer }
                        scoredAt: { type: string, format: date-time, nullable: true, description: When the stored score's inputs were read }
                        verdict:
                          allOf: [{ $ref: '#/components/schemas/FraudVerdict' }]
                          nullable: true
                          description: >
                            The standing ruling, or null when nobody has ruled. Null is the
                            honest answer for "not yet reviewed" — a row without a verdict has
                            not been cleared, it has not been looked at.
                  nextCursor: { type: string, nullable: true }
                  unscored: { type: integer, description: Submitted visits in the window (on the same side of the review line) with no stored score yet }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
        '400': { description: 'Malformed minScore, from, to, limit or cursor' }
        '401': { description: Missing or invalid token }
        '403': { description: Not a manager or admin }
  /dispatch:
    post:
      summary: Rank agents for an outlet (nearest + in-territory) — manager/admin
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 'Ranked candidates + recommended'
          content:
            application/json:
              schema:
                type: object
                properties:
                  outletId: { type: string }
                  candidates: { type: array, items: { $ref: '#/components/schemas/DispatchCandidate' } }
                  recommended:
                    allOf: [{ $ref: '#/components/schemas/DispatchCandidate' }]
                    nullable: true
        '400': { description: Missing outletId }
        '404': { description: Outlet not found }
  /dispatch/agents:
    get:
      summary: Ranked agent candidates for an outlet — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: outletId, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  outletId: { type: string }
                  candidates: { type: array, items: { $ref: '#/components/schemas/DispatchCandidate' } }
        '400': { description: Missing outletId }
  /forecast:
    get:
      summary: Exponential-smoothing demand forecast for a SKU — manager/admin
      description: >-
        The input series is order-derived sell-in (#119): units of the SKU on the
        client's non-cancelled orders per local calendar day in Client.timezone,
        over the last 28 complete days (today excluded), zero-filled, optionally
        at one outlet. It used to be VisitStock.salesActual, which agents no
        longer capture (#112) and which is no longer read. Sell-in is what outlets
        ordered, not consumer sell-out. Coverage days divide the latest observed
        on-shelf units by the forecast daily demand; null when demand is zero.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: skuId, in: query, required: true, schema: { type: string } }
        - { name: outletId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Forecast
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuForecast' }
        '400': { description: Missing skuId }
        '404': { description: SKU not found }
  # ── Sales targets (#119) ──────────────────────────────────────────────────
  /sales-targets:
    get:
      summary: List monthly sell-in targets — manager/admin
      description: >-
        A target is units of sell-in — what outlets ordered through TradeIQ,
        labelled "Sell-in (orders)" — for one SKU and month, client-wide or
        scoped to one territory or one outlet. It is not consumer sell-out.
        Field agents get 403 on every /sales-targets route.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, schema: { type: string, example: '2026-09' }, description: 'YYYY-MM' }
        - { name: skuId, in: query, schema: { type: string } }
        - { name: territoryId, in: query, schema: { type: string }, description: Only targets scoped to this territory }
        - { name: outletId, in: query, schema: { type: string }, description: Only targets scoped to this outlet }
        - { name: scope, in: query, schema: { type: string, enum: [client, territory, outlet] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of targets, newest month first
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SalesTarget' } }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Invalid month, scope or filter }
        '403': { description: Not a manager or admin }
    put:
      summary: Set the target for one SKU, month and scope (create or replace) — manager/admin
      description: >-
        Upserts on (SKU, month, territory, outlet): a second PUT for the same
        scope replaces targetUnits on the same row. territoryId and outletId are
        mutually exclusive; omit both for a client-wide target. Every id must
        belong to the caller's client.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skuId, month, targetUnits]
              properties:
                skuId: { type: string }
                month: { type: string, example: '2026-09', description: 'YYYY-MM (YYYY-MM-01 also accepted)' }
                territoryId: { type: string, nullable: true }
                outletId: { type: string, nullable: true }
                targetUnits: { type: integer, minimum: 0, maximum: 1000000000 }
      responses:
        '200':
          description: Existing target replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesTarget' }
        '201':
          description: Target created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesTarget' }
        '400': { description: Invalid body, or both territoryId and outletId given }
        '403': { description: Not a manager or admin }
        '404': { description: SKU, territory or outlet not found in the caller's client }
  /sales-targets/{id}:
    delete:
      summary: Delete a sales target — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '403': { description: Not a manager or admin }
        '404': { description: Not found in the caller's client }
  /sales-targets/import:
    post:
      summary: Bulk-set targets from a CSV, with a dry-run preview — manager/admin
      description: >-
        Header row required. Columns (case, spaces, underscores ignored): month
        (YYYY-MM), sku (SKU id, or exact name ignoring case), targetUnits (whole
        number), and optional territory (id or code) and outlet (id or code).
        Every row is validated and errors are returned per row; ids and codes
        resolve only within the caller's client. Unless dryRun, all valid rows
        are upserted in one statement (one transaction) — invalid rows do not
        block valid ones, and re-uploading is idempotent. At most 5000 rows.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dryRun, in: query, schema: { type: string, enum: ['true'] }, description: Same as dryRun true in the body }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string, description: The file contents, example: "month,sku,targetUnits,territory,outlet\n2026-09,Cola 2L,1200,,\n" }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: Validation result, and what was (or would be) written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesTargetImportResult' }
        '400': { description: Unreadable CSV, missing required column, no rows, or too many rows }
        '403': { description: Not a manager or admin }
  /sales-targets/attainment:
    get:
      summary: Actual sell-in vs target per SKU for a month — manager/admin
      description: >-
        Actual units are the sum of order-line quantities on the client's
        non-cancelled orders whose createdAt falls within the month's local
        calendar days in Client.timezone — for a Johannesburg client an order at
        23:30Z on the last UTC day of the month counts toward the next month.
        Every SKU is listed (targetUnits null where no client-wide target is
        set), with territory- and outlet-scoped targets under it. A territory's
        actual is the sell-in of its outlets. attainmentPct is actual / target x
        100, null when the target is missing or zero. This is sell-in, not
        consumer sell-out.


        Omit month and the report covers the client's *current* local month —
        the month the wall clock in Client.timezone is in, not the one the
        calling device's clock is in. At 23:30Z on the last day of September a
        Johannesburg client (UTC+2) is answered for 2026-10 and a UTC client for
        2026-09. The month reported on is always echoed back as month, so a
        caller that omitted it can say which month it got.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          required: false
          schema: { type: string, example: '2026-09' }
          description: "YYYY-MM. Omit for the client's current local month in Client.timezone."
        - { name: skuId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Attainment report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesAttainmentReport' }
        '400': { description: month was given but is not YYYY-MM }
        '403': { description: Not a manager or admin }
  # ── Phase 3 Tier-2 ────────────────────────────────────────────────────────
  /orders:
    get:
      summary: List orders (agent sees own; manager sees client's)
      description: >
        Newest first by `createdAt` (arrival), so the cursor pages over a
        sequence that does not reshuffle when an offline order syncs late.
        Each row carries `capturedAt` — when the device took the order, which
        is what dates it for sell-in, the forecast and campaigns (#338).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: outletId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [submitted, confirmed, cancelled] } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  nextCursor: { type: string, nullable: true }
    post:
      summary: Create an in-visit order / sell-in — field_agent/manager
      description: >
        Send `capturedAt` — the device's own capture time (#338) — so an order
        taken offline on the 30th and synced on the 1st is still counted in the
        earlier month. It is never a reason to refuse the order: a payload
        queued by an older build omits it, and a bad device clock sends a value
        out of range; both fall back to the time the server received the order,
        and the fallback is logged.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid }
        '404': { description: Outlet/SKU/visit not found }
  /orders/{id}:
    get:
      summary: Order + lines
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: Not found }
    patch:
      summary: Update order status — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '404': { description: Not found } }
  /messages:
    get:
      summary: List messages visible to the caller
      description: >
        Each message carries `attachments` — metadata and links only, never
        image bytes. Fetch an image from its thumbnailUrl or imageUrl.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  nextCursor: { type: string, nullable: true }
    post:
      summary: Send a direct or broadcast message, optionally with images
      description: >
        Image attachments only (#125), reusing the photo pipeline: upload each
        with `POST /photos` `purpose: message_attachment`, then pass the ids.
        Up to 4 per message. Each photo must belong to the caller's client, be
        uploaded by the caller, be a message-attachment upload (not visit
        evidence), and not already be attached to a message. `body` may be
        blank when at least one image is attached. Announcements do not take
        attachments.


        Idempotent with `clientMessageId` (#308). The client generates one key
        (a UUID) per composed message and sends it on every attempt to send
        that message. It is carried in the body rather than an
        `Idempotency-Key` header because it is stored on the message and
        returned with it. Keys are unique per sender. A retry with the same key
        and the same body, recipientId and attachmentPhotoIds (in order)
        returns the ORIGINAL message with 200 and `Idempotent-Replayed: true`,
        not a duplicate and not a 409, so a send whose response was lost can
        be retried safely. The same key with a different message is a 409:
        answering with the original would tell the sender their new message
        went out when it did not. Two concurrent requests with one key create
        one message; the other gets the 200 replay.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                recipientId: { type: string, description: 'omit for a broadcast to the whole client' }
                attachmentPhotoIds: { type: array, maxItems: 4, uniqueItems: true, items: { type: string } }
                clientMessageId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9._:-]+$'
                  description: 'idempotency key, one per composed message (a UUID); optional'
      responses:
        '200':
          description: Replay — a message with this clientMessageId from this sender already exists and is returned unchanged
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '201':
          description: Sent
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '400': { description: Empty body with no images, malformed or repeated attachmentPhotoIds, more than 4 images, visit evidence attached, or a malformed clientMessageId }
        '404': { description: Recipient not found, or an attachment photo not found / not in the client / not uploaded by the caller }
        '409': { description: An attachment photo is already attached to a message, or clientMessageId was already used by this sender for a different message }
  /messages/{id}/read:
    patch:
      summary: Mark a message read (recipient only)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Marked read
          content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } }
        '404': { description: Not found }
  /announcements:
    get:
      summary: List the client's announcements
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Announcements } }
    post:
      summary: Post an announcement — manager/admin
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid }, '403': { description: Forbidden } }
  /webhooks:
    get:
      summary: List webhook subscriptions — manager/admin
      description: >
        Each webhook carries its delivery health: `consecutiveFailures`
        (deliveries that gave up since the last success), `lastDeliveryStatus`
        and `lastDeliveryAt`, and a derived `health` of healthy | failing |
        unhealthy.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
                  nextCursor: { type: string, nullable: true }
    post:
      summary: Create a webhook subscription — manager/admin
      description: >
        `event` is the event to subscribe to. TradeIQ emits `visit.submitted`,
        `alert.raised`, `order.created` and `report.generated` (a report
        schedule ran; payload is ReportGeneratedPayload). Any non-empty string
        is accepted, but an event not on that list never fires.
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid url/event }, '403': { description: Forbidden } }
  /webhooks/{id}:
    patch:
      summary: Update a webhook — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '404': { description: Not found } }
    delete:
      summary: Delete a webhook — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /webhooks/{id}/deliveries:
    get:
      summary: Recent deliveries to a webhook, newest first — manager/admin
      description: >
        Every event fanned out to a webhook is a delivery. The first attempt is
        made immediately; failures (non-2xx, network error or timeout) retry
        after 1m, 5m, 25m, 2h and 6h, then give up. Each attempt carries
        `X-TradeIQ-Delivery` (stable across retries — de-duplicate on it) and
        `X-TradeIQ-Delivery-Attempt`, and is re-signed with a fresh
        `X-TradeIQ-Timestamp`; the body is identical on every attempt.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/WebhookDelivery' } }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Invalid limit }
        '403': { description: Forbidden }
        '404': { description: Not found (or another client's webhook) }
  /webhook-deliveries/{id}/redeliver:
    post:
      summary: Re-queue a failed delivery and attempt it now — manager/admin
      description: >
        Allowed for `gave_up` and `failed_retrying` deliveries. The attempt
        count is kept, so a redelivered give-up that fails again gives up again
        rather than starting a fresh retry schedule.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '202':
          description: Re-queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '403': { description: Forbidden }
        '404': { description: Not found (or another client's delivery) }
        '409': { description: Delivery already succeeded or is already queued }
