            application/json:
              schema: { $ref: '#/components/schemas/Contest' }
        '400': { description: Invalid body or dates out of order }
        '403': { description: Forbidden }
        '404': { description: Territory not found (or another client's) }
  /contests/current:
    get:
      summary: Active and recently ended contests with standings and the caller's rank
      description: >
        The agent's Contests view; open to every signed-in user, like the
