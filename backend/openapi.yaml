  # ── Follow-ups (Phase 1/3) ────────────────────────────────────────────────
  /clients/me:
    get:
      summary: The caller's client config (scorecard weights / KPI thresholds / timezone / working hours)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Config
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    id,
                    name,
                    industry,
                    scorecardWeights,
                    kpiThresholds,
                    assistantEnabled,
                    timezone,
                    workHoursStart,
                    workHoursEnd,
                    workDays,
                  ]
                properties:
                  id: { type: string }
                  name: { type: string }
                  industry: { type: string }
                  scorecardWeights: { type: object, additionalProperties: { type: number } }
                  kpiThresholds: { type: object, additionalProperties: { type: number } }
                  assistantEnabled: { type: boolean, description: 'Read-only rollout flag' }
                  timezone:
                    type: string
                    example: Africa/Johannesburg
                    description: >-
                      IANA zone the client's calendar days are counted in (#309):
                      beat-plan route-stop matching, trend day/week buckets and the
                      assistant's periods. Defaults to Africa/Johannesburg.
                  workHoursStart:
                    type: string
                    example: '07:00'
                    description: >-
                      When the field team's working day starts, HH:MM on the wall
                      clock of `timezone` (#153 T2). Inclusive.
                  workHoursEnd:
                    type: string
                    example: '17:00'
                    description: >-
                      When it ends, HH:MM. EXCLUSIVE — a background ping stamped
                      exactly at this time is outside the window.
                  workDays:
                    type: array
                    items: { type: integer, minimum: 1, maximum: 7 }
                    example: [1, 2, 3, 4, 5]
                    description: >-
                      The days that window applies to, as ISO weekdays: 1 = Monday
                      … 7 = Sunday. Sorted, unique, never empty. Read by exactly one
                      thing — the window background location tracking may run in.
                      It is not a shift model and not attendance.
    patch:
      summary: Update scoring config (admin), timezone and working hours (manager/admin)
      description: >-
        scorecardWeights and kpiThresholds are admin-only — a manager sending
        either gets 403, even alongside timezone or working hours, and nothing is
        changed. A manager may send timezone and the working-hours fields on
        their own. The three working-hours fields are one window: whichever are
        sent, all three are validated together against what is currently stored
        and written together, so a new start can never land against an old end.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                At least one of scorecardWeights, kpiThresholds, timezone,
                workHoursStart, workHoursEnd or workDays is required.
              properties:
                scorecardWeights: { type: object, additionalProperties: { type: number, minimum: 0 } }
                kpiThresholds: { type: object, additionalProperties: { type: number } }
                timezone:
                  type: string
                  example: America/New_York
                  description: >-
                    A canonical IANA zone name as listed by the runtime's
                    Intl.supportedValuesOf('timeZone'), or UTC. Case-sensitive;
                    offsets (+02:00), abbreviations (SAST) and aliases are a 400.
                workHoursStart:
                  type: string
                  example: '07:00'
                  description: >-
                    HH:MM, 24-hour. Must be strictly before workHoursEnd once
                    applied. An overnight window is a 400: it would span two
                    calendar days, which the per-local-day retention summaries
                    could not agree with.
                workHoursEnd: { type: string, example: '17:00', description: 'HH:MM, 24-hour.' }
                workDays:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 1, maximum: 7 }
                  example: [1, 2, 3, 4, 5]
                  description: >-
                    ISO weekdays, 1 = Monday … 7 = Sunday. Stored sorted. Empty,
                    repeated or out-of-range entries are a 400 — an empty list
                    would be a second, silent kill switch no agent can see.
      responses:
        '200': { description: 'Updated config (same shape as GET)' }
        '400':
          description: >-
            Empty body, invalid weights/thresholds, not an IANA timezone, a
            malformed HH:MM, a start at or after the end, or a bad workDays list
        '403': { description: 'Field agent; or a manager sending scorecardWeights/kpiThresholds' }
  /users:
    get:
      summary: List client users — manager/admin
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Users, alphabetical by email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SafeUser' } }
                  nextCursor: { type: string, nullable: true }
    post:
      summary: Provision a user — admin
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:
                  type: string
                  description: >
                    Trimmed and lower-cased before storage, so the address is
                    held in the one form login looks up. Two addresses differing
                    only in case or surrounding whitespace collide and the
                    second is a 409.
                password: { $ref: '#/components/schemas/NewPassword' }
                role: { type: string, enum: [field_agent, manager, admin] }
                displayName:
                  type: string
                  nullable: true
                  maxLength: 120
                  description: >
                    Optional. Trimmed; a blank string or null stores no name.
                    Longer than 120 characters after trimming is a 400.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeUser' }
        '400': { description: 'Invalid email/password/role, or invalid displayName' }
        '403': { description: Forbidden }
        '409': { description: Duplicate email }
  /users/{id}:
    patch:
      summary: Update a user (active/role/displayName) — admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of active, role or displayName is required.
              properties:
                active: { type: boolean }
                role: { type: string, enum: [field_agent, manager, admin] }
                displayName:
                  type: string
                  nullable: true
                  maxLength: 120
                  description: >
                    Trimmed. null or a blank string clears the name; omit the
                    key to leave it unchanged.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SafeUser' }
        '400': { description: Invalid }
        '404': { description: Not found }
  /users/password-events:
    get:
      summary: The password audit trail — admin (#400)
      description: >
        Who changed or reset whose password, when, and by which route. Tenant
        scoped, newest first, cursor-paginated. Holds no secret: no code, no
        password, no hash.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'A page of events: `{ data, nextCursor }`' }
        '403': { description: Forbidden }
  /users/{id}/password:
    post:
      summary: Set a user's password — admin for anyone in the tenant, manager for field agents (#400)
      description: >
        Audited. A manager targeting a manager or an admin is a 403; a user in
        another tenant is a 404, the same answer PATCH /users/{id} gives. Other
        sessions are not ended (see /auth/change-password).
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChangeResult' }
        '400': { description: The password breaks the password rule }
        '403': { description: Not permitted to set this user's password }
        '404': { description: No such user in this tenant }
        '429': { description: Too many attempts }
  /users/{id}/password-reset-code:
    post:
      summary: Generate a one-time reset code to read out to an agent — admin, or manager for field agents (#400)
      description: >
        The only place a code is ever returned, and only to the caller. Stored
        as a bcrypt hash, never logged, never written to the audit trail.
        Issuing retires any earlier live code for that user. Deactivated users
        get no code. Same role and tenant scoping as /users/{id}/password.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, description: Eight digits. Shown once. }
                  expiresAt: { type: string, format: date-time }
                  userId: { type: string }
                  email: { type: string }
        '403': { description: Not permitted to reset this user }
        '404': { description: No such user in this tenant }
        '429': { description: Too many codes generated }
  /incentives:
    get:
      summary: List incentive schemes
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Schemes } }
    post:
      summary: Create an incentive scheme — manager/admin
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid metric }, '403': { description: Forbidden } }
  /incentives/earned:
    get:
      summary: Agents who met active scheme thresholds + reward points
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Earned incentives, one row per (active scheme, qualifying agent)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    schemeId: { type: string }
                    schemeName: { type: string }
                    metric: { type: string, enum: [scorecard, tasks_closed, visits] }
                    agentId: { type: string }
                    email: { type: string }
                    displayName: { $ref: '#/components/schemas/DisplayName' }
                    metricValue: { type: number }
                    rewardPoints: { type: number }
  /incentives/{id}:
    patch:
      summary: Update an incentive scheme — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '404': { description: Not found } }
    delete:
      summary: Delete an incentive scheme — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /report-schedules:
    get:
      summary: List report schedules — manager/admin
      description: >
        Active schedules are fired automatically by the schedule worker (#66).
        Each carries `nextRunAt` (null while paused) and `lastRunAt`. Daily is
        every 24h and weekly every 7 days from the previous due time, in UTC
        (per-client timezones are #309). A schedule missed while no backend
        instance was running fires once on catch-up, not once per missed
        period. Each run is generated and delivered as a `report.generated`
        webhook event to the client's active webhooks subscribed to it, and
        emailed to `recipients` when SMTP is configured on the deployment
        (otherwise the run records email as `not_configured`).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ReportSchedule'
                        - type: object
                          properties:
                            reportDefinition:
                              type: object
                              properties:
                                name: { type: string }
                  nextCursor: { type: string, nullable: true }
    post:
      summary: Schedule a saved report — manager/admin
      description: >
        The first run is one cadence period after creation. `recipients` must be
        1–50 email addresses; they are trimmed and de-duplicated
        case-insensitively.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportDefinitionId, cadence, recipients]
              properties:
                reportDefinitionId: { type: string }
                cadence: { type: string, enum: [daily, weekly] }
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: email }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSchedule' }
        '400': { description: Invalid (including a recipient that is not an email address) }
        '404': { description: Report definition not found }
  /report-schedules/{id}:
    patch:
      summary: Update a report schedule — manager/admin
      description: >
        Pausing (`active: false`) clears `nextRunAt`. Resuming schedules the
        next run one period from now; it does not fire for the time spent
        paused. Changing the cadence of an active schedule counts the new
        period from the previous due time. `recipients`, when given, follows
        the same rules as on create.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                active: { type: boolean }
                cadence: { type: string, enum: [daily, weekly] }
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: email }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSchedule' }
        '400': { description: Invalid (including a recipient that is not an email address) }
        '404': { description: Not found }
    delete:
      summary: Delete a report schedule — manager/admin
      description: The schedule's runs are deleted with it, so their CSV links stop resolving.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /report-schedules/{id}/run:
    post:
      summary: Generate and deliver the scheduled report now — manager/admin
      description: >
        The same code path as a scheduled run: generates the report, records a
        run, and delivers it through every channel (a `report.generated`
        webhook event, and one email per recipient when SMTP is configured).
        Does not move `nextRunAt`.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Generated, recorded and handed to the delivery channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRunResult' }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /report-schedules/{id}/runs:
    get:
      summary: A schedule's run history — manager/admin
      description: >
        The schedule's runs, scheduled and manual, newest first. Each run
        carries a derived `status` across every channel, a delivery `summary`
        (webhook deliveries delivered/failed/pending; emails
        sent/failed/pending/not configured), the `reason` when something was
        not sent or failed, the run's webhook delivery results, and the signed
        `csvDownloadUrl` while it works (null when PUBLIC_API_URL or
        REPORT_LINK_SECRET is not configured, and after the link's 7 days).
        Per-recipient email deliveries are at
        `GET /report-schedules/{id}/runs/{runId}/email-deliveries`. Another
        client's schedule is a 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReportRunHistoryItem' } }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Invalid limit or cursor }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden (not manager/admin) }
        '404': { description: Not found (or another client's schedule) }
  /report-schedules/{id}/runs/{runId}/csv:
    get:
      summary: Download a run's report as CSV — manager/admin
      description: >
        What a `report.generated` webhook's `csvPath` points at, fetched with a
        manager/admin bearer token. Machine subscribers that hold no token use
        the signed `csvDownloadUrl` instead (`GET /report-downloads/{token}`).
        The rows are regenerated
        from the schedule's report definition, bounded to records whose report
        date (checkinTs for visits, createdAt otherwise) is at or before the
        run's `generatedAt`: records added after the run are excluded, while
        field values are current rather than frozen. Another client's run is a
        404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The run's report (attachment)
          content:
            text/csv:
              schema: { type: string }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden (not manager/admin) }
        '404': { description: Not found (or another client's schedule or run) }
  /report-schedules/{id}/runs/{runId}/email-deliveries:
    get:
      summary: A run's email delivery log — manager/admin
      description: >
        One row per recipient the run was emailed to, newest first: status,
        attempts, the last error, and whether the CSV was attached. Failed
        sends are retried on the webhook schedule (1m, 5m, 25m, 2h, 6h) and give
        up after 6 attempts. Empty when email was not configured for the run
        (see the run's `deliveries`). Another client's run is a 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Email deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReportEmailDelivery' } }
                  nextCursor: { type: string, nullable: true }
        '401': { description: Unauthenticated }
        '403': { description: Forbidden (not manager/admin) }
        '404': { description: Not found (or another client's schedule or run) }
  /report-downloads/{token}:
    get:
      summary: Download a run's CSV through a signed link — no bearer token (#66)
      description: >
        The `csvDownloadUrl` of a `report.generated` webhook payload, and the
        link in report emails. The token is an HMAC (REPORT_LINK_SECRET) over
        one client, one schedule and one run, with an expiry 7 days after the
        run was generated: it opens that run's CSV and nothing else, and needs
        no login. Anyone holding the link can download the file until it
        expires, so treat it as a credential. Rotating REPORT_LINK_SECRET
        revokes every link. Same CSV as `GET /report-schedules/{id}/runs/{runId}/csv`.
        Rate-limited per IP. Responses are `Cache-Control: private, no-store`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: Opaque signed token, as issued in `csvDownloadUrl`.
      responses:
        '200':
          description: The run's report (attachment)
          content:
            text/csv:
              schema: { type: string }
        '401': { description: Invalid link (malformed, tampered, signed with another key, or links not configured) }
        '404': { description: The link is valid but its run no longer exists (the schedule was deleted) }
        '410': { description: The link has expired }
        '429': { description: Too many downloads from this address }
  /locations/settings:
    get:
      summary: Location sharing settings for the signed-in agent — field agent (#153 T1, T2)
      description: >
        The top-level fields are FOREGROUND sharing (T1): the heartbeat interval
        (Client.kpiThresholds.locationPingIntervalSeconds, default 120, clamped
        to 60–900), the current foreground notice version, and the agent's answer
        to it. The app sends no foreground pings unless sharingEnabled.

        `background` (T2) reports background tracking INDEPENDENTLY: its own
        notice, its own answer, and the client's working-hours window. Accepting
        one notice never implies the other, and revoking either leaves the other
        exactly where it was.

        The working window is resolved here into INSTANTS (windowOpensAt /
        windowClosesAt) rather than shipping the client's timezone rules to the
        phone: the app only has to compare its clock against two instants, and a
        phone whose clock is wrong cannot move the boundary, because ingest
        re-checks every ping against the same window on arrival.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  intervalSeconds: { type: integer, minimum: 60, maximum: 900 }
                  noticeVersion: { type: string }
                  consent:
                    type: object
                    nullable: true
                    description: The latest answer to the CURRENT foreground notice; null if unanswered.
                    properties:
                      decision: { type: string, enum: [acknowledged, declined] }
                      noticeVersion: { type: string }
                      decidedAt: { type: string, format: date-time }
                  sharingEnabled: { type: boolean }
                  background:
                    type: object
                    description: Background tracking between stores (#153 T2). Android only, app-side.
                    properties:
                      intervalSeconds:
                        type: integer
                        example: 600
                        description: How often the Android foreground service takes a fix. Ten minutes.
                      noticeVersion:
                        type: string
                        description: Versioned separately from the foreground notice; the two move independently.
                      consent:
                        type: object
                        nullable: true
                        description: The latest answer to the CURRENT background notice; null if unanswered.
                        properties:
                          decision: { type: string, enum: [acknowledged, declined] }
                          noticeVersion: { type: string }
                          decidedAt: { type: string, format: date-time }
                      enabled:
                        type: boolean
                        description: True only when the agent has acknowledged the current background notice.
                      workingHours:
                        type: object
                        description: The client's window, and the zone its wall clock is read in.
                        properties:
                          start: { type: string, example: '07:00' }
                          end: { type: string, example: '17:00', description: 'Exclusive.' }
                          days:
                            type: array
                            items: { type: integer, minimum: 1, maximum: 7 }
                            description: 'ISO weekdays, 1 = Monday … 7 = Sunday.'
                          timezone: { type: string, example: Africa/Johannesburg }
                      withinWorkingHours:
                        type: boolean
                        description: Whether the window is open right now, on the server clock.
                      windowClosesAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the open window closes. Null when it is shut.
                      windowOpensAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the next window opens. Null when one is already open.
        '403': { description: Not a field agent }
  /locations/consent:
    post:
      summary: Record the agent's answer to a location notice — field agent (#153 T1, T2)
      description: >
        Append-only; the latest answer to the current version of that notice
        wins. A re-sent identical answer adds no row. decidedAt is the device's
        tap time (the answer may queue offline) and is clamped to the server
        clock.

        `kind` says WHICH notice is being answered. The two are wholly
        independent: declining background leaves the foreground heartbeat
        running, and declining foreground leaves a background acknowledgement
        standing. noticeVersion must match the current version OF THAT KIND, or
        the answer is a 409 rather than being recorded against the wrong wording.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, noticeVersion]
              properties:
                decision: { type: string, enum: [acknowledged, declined] }
                kind:
                  type: string
                  enum: [foreground, background]
                  default: foreground
                  description: >-
                    Which notice. Absent means foreground, so an app build that
                    predates T2 keeps recording answers against the notice it
                    actually showed.
                noticeVersion: { type: string }
                decidedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision: { type: string, enum: [acknowledged, declined] }
                  kind: { type: string, enum: [foreground, background] }
                  noticeVersion: { type: string }
                  decidedAt: { type: string, format: date-time }
        '400': { description: Invalid decision, kind, noticeVersion or decidedAt }
        '403': { description: Not a field agent }
        '409': { description: The answer is for an older version of that notice }
  /locations:
    post:
      summary: Ingest a batch of location pings — field agent (#153 T1 foreground, T2 background)
      description: >
        Pings queue offline and may arrive late and out of order; ordering is by
        recordedAt, never arrival. User.lastLat/lastLng/lastSeenAt move forward
        only. A structurally invalid ping rejects the whole batch (400). Stored
        idempotently on (agent, recordedAt). Well-formed pings are ignored (not
        stored) when older than the 90-day retention window, more than 10 minutes
        in the future, or recorded before the agent acknowledged the relevant
        notice.

        `source` covers the WHOLE batch and decides two things: which notice must
        have been acknowledged, and whether the client's working-hours window
        applies. A background ping recorded outside that window is ignored and
        counted in `outsideWorkingHours` — not refused. A batch is a queue flush,
        so it routinely straddles the edge of the window, and rejecting it would
        throw away the legitimate pings with the late one. The window is a
        property of each ping's own recordedAt, so it is only evaluated per ping.
        Refusal is reserved for consent, which is the one condition the app must
        change its behaviour in response to.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pings]
              properties:
                source:
                  type: string
                  enum: [foreground, background]
                  default: foreground
                  description: >-
                    What produced this batch. Absent means foreground, so an app
                    build that predates T2 keeps working unchanged.
                pings:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [lat, lng, recordedAt]
                    properties:
                      lat: { type: number, minimum: -90, maximum: 90 }
                      lng: { type: number, minimum: -180, maximum: 180 }
                      accuracyM: { type: number, minimum: 0, nullable: true }
                      recordedAt: { type: string, format: date-time, description: 'Full ISO-8601 instant with Z or an offset' }
      responses:
        '200':
          description: Batch processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  duplicates: { type: integer }
                  ignored: { type: integer }
                  outsideWorkingHours:
                    type: integer
                    description: >-
                      How many of `ignored` fell outside the client's working
                      hours. Present only on a background batch — a foreground
                      heartbeat runs whenever the agent has the app open, so the
                      number would be meaningless there.
        '400': { description: Malformed batch, bad source, out-of-range coordinates, or more than 100 pings }
        '403':
          description: >-
            Not a field agent, or the notice covering this source is not
            acknowledged. The code names WHICH notice, so a missing background
            acknowledgement never makes the app stop the foreground heartbeat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code:
                    type: string
                    enum: [location_consent_required, background_location_consent_required]
  /agents/locations:
    get:
      summary: Each field agent's latest location, age and live state — manager/admin (#153 T1, T2)
      description: >
        Paged by agent (limit default 50, max 200). States, first match wins:
        not_sharing (the agent's latest answer to the current FOREGROUND location
        notice is declined — takes precedence over any stored ping, and
        lastPing/ageSeconds are then null); offline (older than
        offlineAfterSeconds = 1800, or never shared, including an agent who never
        answered the notice); stale (older than staleAfterSeconds = max(300, 3 ×
        intervalSeconds)); in_transit (fresh ping outside every fence); at_store
        (fresh ping inside an outlet's 50m check-in geofence with accuracyM not
        null and ≤ maxAtStoreAccuracyM = 100); near_store (fresh ping inside a
        fence whose accuracyM is null or above maxAtStoreAccuracyM — lastOutlet
        names the fence). Age decides before place. ageSeconds is measured against
        serverTime.

        Background pings (#153 T2) feed the SAME states — a manager should not
        have to learn a second vocabulary to read the same map — but a background
        ping can never read at_store or near_store, and never names a fence in
        lastOutlet. The best it reads is in_transit. A background fix is taken by
        a service on a ten-minute timer with the phone in a pocket, which is not
        evidence anybody was in the shop; presence in a store is established by
        check-in and by the foreground heartbeat instead. Such an agent falls
        back to their last confirmed check-in for lastOutlet.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: territoryId, in: query, schema: { type: string }, description: A Territory.id; restricts to agents assigned to it }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverTime: { type: string, format: date-time }
                  intervalSeconds: { type: integer }
                  staleAfterSeconds: { type: integer }
                  offlineAfterSeconds: { type: integer }
                  maxAtStoreAccuracyM: { type: integer, description: 'The worst GPS accuracy, in metres, at which a ping inside a fence reads at_store' }
                  nextCursor: { type: string, nullable: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        agentId: { type: string }
                        name: { type: string, description: 'displayName, else email' }
                        displayName: { $ref: '#/components/schemas/DisplayName' }
                        email: { type: string }
                        state: { type: string, enum: [at_store, near_store, in_transit, stale, offline, not_sharing] }
                        lastPing:
                          type: object
                          nullable: true
                          description: Null when the agent has never shared, and always null for not_sharing.
                          properties:
                            lat: { type: number }
                            lng: { type: number }
                            accuracyM: { type: number, nullable: true }
                            recordedAt: { type: string, format: date-time }
                            source:
                              type: string
                              enum: [foreground, background]
                              description: >-
                                What took this fix. A background one is placed on
                                the map and ages normally, but names no store.
                        ageSeconds: { type: integer, nullable: true }
                        currentOutlet:
                          type: object
                          nullable: true
                          description: Set only when state is at_store.
                          properties:
                            id: { type: string }
                            name: { type: string }
                        lastOutlet:
                          type: object
                          nullable: true
                          description: >
                            The latest ping's fence (source ping) when it was inside
                            one, otherwise the latest confirmed check-in (source check_in).
                            For not_sharing, only a check-in is ever given.
                          properties:
                            id: { type: string }
                            name: { type: string }
                            at: { type: string, format: date-time }
                            source: { type: string, enum: [ping, check_in] }
        '400': { description: Malformed limit or cursor }
        '403': { description: Forbidden }
  /push/devices:
    post:
      summary: Register or refresh this device's push token — any role (#67)
      description: >
        Called by the app after sign-in and whenever FCM rotates the token. The
        user and tenant come from the bearer token, never the body. Idempotent:
        the same token again only moves lastSeenAt. A token is one app install,
        so a token already registered to another user (the phone changed hands,
        in this tenant or another) is re-pointed to the caller instead of
        duplicated. Tokens FCM later reports as unregistered or invalid are
        deleted by the server. Push is sent only once the server has
        FIREBASE_SERVICE_ACCOUNT configured; registering works either way.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, minLength: 1, maxLength: 4096, description: FCM registration token (no whitespace) }
                platform: { type: string, enum: [android, ios, web] }
      responses:
        '200':
          description: Registered or refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushDevice' }
        '400': { description: Missing or invalid token or platform }
        '401': { description: Missing or invalid bearer token }
  /push/devices/{token}:
    delete:
      summary: Unregister a push token (sign-out) — any role (#67)
      description: >
        Removes the token only when it is registered to the caller in the
        caller's tenant. 204 either way: a token that is gone, or now belongs to
        someone else, is left untouched and is not an error.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          description: The FCM registration token, URL-encoded
          schema: { type: string }
      responses:
        '204': { description: Removed, or nothing of the caller's to remove }
        '400': { description: Invalid token }
        '401': { description: Missing or invalid bearer token }
  /push/preferences:
    get:
      summary: The caller's push notification preferences — any role (#67)
      description: Every category defaults to on until the user switches it off.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '401': { description: Missing or invalid bearer token }
    patch:
      summary: Update the caller's push notification preferences — any role (#67)
      description: >
        Send only the categories to change; the response is the full set.
        alerts = alert.raised (managers and admins); tasks = a task assigned to
        you by someone else; messages = direct messages, team broadcasts and
        announcements; sla = a task past its SLA (the owner, and managers and
        admins), announced once, by a server sweep, within a day of the breach.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                alerts: { type: boolean }
                tasks: { type: boolean }
                messages: { type: boolean }
                sla: { type: boolean }
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { description: Empty body, unknown category, or a non-boolean value }
        '401': { description: Missing or invalid bearer token }
  # ── Competitor shelf prices (off by default; docs/operations/competitor-price-collection.md) ──
  /competitor-prices/settings:
    get:
      summary: Competitor price collection switch, approval, and whether it is actually live (admin)
      description: >
        Live only when COMPETITOR_PRICE_COLLECTION=on AND the client is enabled AND both approval
        fields are set. `inactiveReason` says which is missing.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'enabled, approvedBy, approvedAt, killSwitch (on|off), active, inactiveReason' }
        '403': { description: Not an admin }
  /competitor-prices/settings/enable:
    post:
      summary: Enable collection for this client (admin; requires legal approval fields; audited)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvedBy, approvedAt]
              properties:
                approvedBy: { type: string, description: 'Who signed off the legal review' }
                approvedAt: { type: string, description: 'ISO date or date-time, not in the future' }
                note: { type: string }
      responses:
        '200': { description: Settings after the change }
        '400': { description: Missing or invalid approval }
        '403': { description: Not an admin }
  /competitor-prices/settings/disable:
    post:
      summary: Disable collection for this client and clear the approval (admin; audited)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings after the change }
        '403': { description: Not an admin }
  /competitor-prices/audit:
    get:
      summary: Append-only ledger of switch changes (admin)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'items[]' }, '403': { description: Not an admin } }
  /competitor-prices/retailers:
    get:
      summary: Retailer adapters and their status (implemented | stub) (admin)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: 'items[]' }, '403': { description: Not an admin } }
  /competitor-prices/mappings:
    get:
      summary: Admin-maintained competitor SKU to retailer product page mappings (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: includeInactive, in: query, schema: { type: string, enum: ['true', 'false'] } }
      responses: { '200': { description: 'items[]' }, '403': { description: Not an admin } }
    post:
      summary: Map a competitor SKU to a retailer product page (admin). No automatic matching.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competitorSku, retailer, productUrl]
              properties:
                competitorSku: { type: string }
                competitorBrand: { type: string, nullable: true }
                retailer: { type: string, description: 'Adapter id from /competitor-prices/retailers' }
                productUrl: { type: string, description: "https product page on the retailer's own host" }
                packSize: { type: string, nullable: true }
                ourSkuId: { type: string, nullable: true, description: 'One of our SKUs, for the price gap' }
      responses:
        '201': { description: Created }
        '400': { description: Invalid (unknown retailer, wrong host, not our SKU) }
        '403': { description: Not an admin }
        '409': { description: Already mapped }
  /competitor-prices/mappings/{id}:
    patch:
      summary: Update or deactivate a mapping (admin, own client only)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid }
        '404': { description: Not found (including another client's mapping) }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TrendTerritoryId:
      name: territoryId
      in: query
      description: >-
        A Territory.id of the caller's client. Resolved to the territory's code
        (which Outlet.territoryId stores); an unknown or foreign id returns an
        empty series.
      schema: { type: string }
  schemas:
    CheckInResponse:
      type: object
      description: >
        A whole Visit row, plus `deduplicated` (#379, #385). Additive: every field
        POST /visits has always returned is unchanged, so a client that only reads `id`
        needs no change whether it gets a 201 or a 200.
      properties:
        id: { type: string }
        outletId: { type: string }
        agentId: { type: string }
        clientId: { type: string }
        checkinTs: { type: string, format: date-time }
        checkinLat: { type: number }
        checkinLng: { type: number }
        geofencePass: { type: boolean }
        checkinDistanceM: { type: number, nullable: true }
        status: { type: string, enum: [in_progress, submitted] }
        submittedAtClient: { type: string, format: date-time, nullable: true }
        clientVisitId:
          type: string
          nullable: true
          description: The device's idempotency key as stored; null when the app sent none
        resumedFromDraft:
          type: boolean
          description: True when the agent resumed a saved draft rather than checking in fresh (#379)
        deduplicated:
          type: boolean
          description: >
            True when this request found the visit already stored under its `clientVisitId`
            and returned THAT one (HTTP 200) instead of creating a second. False on a fresh
            create (HTTP 201) and whenever no key was sent.
    FraudVerdict:
      type: object
      description: >
        One manager's standing ruling on one flagged visit (#392, #395). A ledger entry:
        `reviewer.label` is the name frozen as it read when the ruling was made, so a
        renamed or deactivated reviewer neither rewrites nor erases it.
      required: [visitId, verdict, reviewer, note, riskScoreAtReview, decidedAt]
      properties:
        visitId: { type: string }
        verdict: { type: string, enum: [confirmed, dismissed, inconclusive] }
        reviewer:
          type: object
          required: [id, label]
          properties:
            id: { type: string }
            label: { type: string, description: "Display name, or the email when they have none" }
        note: { type: string, nullable: true, description: 'null when the reviewer added none — never ""' }
        riskScoreAtReview:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            The stored Visit.riskScore the reviewer was actually looking at. Visit.riskScore
            is a snapshot a rescore can move afterwards, so without this a dismissal read
            later looks as though it was made against a number nobody ever saw. NULL — never
            0 — when the visit was unscored at review time.
        decidedAt: { type: string, format: date-time }
    Scorecard:
      type: object
      description: >
        One visit's perfect-store score. Every field this endpoint has always returned is
        unchanged; `scoredAt` and `provisional` are added (#390, #399).
      required: [id, visitId, dimensionScores, weightedTotal, ratingBand, createdAt, scoredAt, provisional]
      properties:
        id: { type: string }
        visitId: { type: string }
        dimensionScores:
          type: object
          additionalProperties: { type: number }
          description: >
            Keyed by dimension. A dimension with nothing to measure is OMITTED, not zero.
        weightedTotal: { type: number, minimum: 0, maximum: 100 }
        ratingBand: { type: string, enum: [green, amber, red] }
        createdAt: { type: string, format: date-time, description: When the FIRST score for this visit was written; survives a regenerate }
        scoredAt: { type: string, format: date-time, description: When the SERVER last computed `weightedTotal` }
        provisional:
          type: object
          nullable: true
          description: >
            The score the DEVICE showed the agent (#390, #399). NULL means "we do not know
            what they saw" — no client sent one, which is true of every scorecard written
            before this existed and of every older app build — and must never render as 0.
            Reported back and nothing else: no KPI, aggregate or scorecard maths reads it.
          required: [weightedTotal, ratingBand, seenAt]
          properties:
            weightedTotal: { type: number, minimum: 0, maximum: 100 }
            ratingBand: { type: string, enum: [green, amber, red] }
            seenAt:
              type: string
              format: date-time
              nullable: true
              description: The device clock when it showed that score; null when the client sent none
    AuditTemplate:
      type: object
      description: >
        A client's versioned dynamic-form template. `schema` is free-form JSON
        (sections → fields with id/label/type/required/weight/visibleIf/options,
        plus an optional top-level `scoring` map); the app renders it. A schema
        edit bumps `version`.
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: string }
        industry: { type: string, nullable: true }
        schema: { type: object, additionalProperties: true }
        version: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    MessageAttachment:
      type: object
      description: >
        An image attached to a message (#125). Images only, via the photo
        pipeline. Metadata and links — the image bytes are never inlined.
      properties:
        photoId: { type: string }
        position: { type: integer, description: '0-based, in the order the sender attached them' }
        thumbnailUrl: { type: string, example: '/photos/{photoId}/thumbnail' }
        imageUrl: { type: string, example: '/photos/{photoId}/image' }
    Message:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        senderId: { type: string }
        recipientId: { type: string, nullable: true, description: 'null for a broadcast' }
        body: { type: string }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        attachments: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/MessageAttachment' } }
        clientMessageId: { type: string, nullable: true, description: "the sender's idempotency key; null when sent without one" }
    DisplayName:
      type: string
      nullable: true
      maxLength: 120
      description: >
        What people call this person ("Sipho Ndlovu"). null when none was ever
        set — accounts that predate the field are not given one guessed from
        the email. Clients should show the email when this is null.
    NewPassword:
      type: string
      minLength: 12
      description: >
        The one password rule, shared by POST /users and every route that sets
        a password: at least 12 characters (ignoring surrounding spaces), at
        most 72 bytes (bcrypt's ceiling), not the account's own email, not one
        of a short list of fleet-default passwords. No composition rules. A
        400 states the rule and never echoes the input.
    PasswordChangeResult:
      type: object
      properties:
        otherSessionsEnded:
          type: boolean
          enum: [false]
          description: Always false today. Tokens are stateless; sessions minted before the change run to their 12h expiry.
    AppUpdateRequired:
      type: object
      description: >
        The body of a 426 from ANY route but /health, sent when the operator
        has set MIN_APP_VERSION and the request's X-App-Version header is
        older (or, with MIN_APP_VERSION_REQUIRE_HEADER=true, absent). Unset by
        default, meaning no minimum. The app shows an "update the app" screen.
      properties:
        error: { type: string }
        code: { type: string, enum: [app_update_required] }
        minimumVersion: { type: string, example: 1.5.0 }
    SafeUser:
      type: object
      description: A user as it may appear on the wire. Never carries passwordHash, clientId or GPS.
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        role: { type: string, enum: [field_agent, manager, admin] }
        active: { type: boolean }
        lastSeenAt: { type: string, format: date-time, nullable: true }
    DispatchCandidate:
      type: object
      properties:
        agentId: { type: string }
        email: { type: string }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        distanceM: { type: number, nullable: true }
        inTerritory: { type: boolean }
        lastSeenAt: { type: string, format: date-time, nullable: true }
    LeaderboardEntry:
      type: object
      properties:
        agentId: { type: string }
        email: { type: string }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        visitsSubmitted: { type: integer }
        tasksClosed: { type: integer }
        avgScorecard: { type: number }
        points: { type: number }
        rank: { type: integer }
    PointsLedgerEntry:
      type: object
      description: >
        One points-earning event (#124). The leaderboard's points are
        mean(score of `scorecard` entries) + the sum of `points`, over entries
        whose occurredAt is in the window.
      properties:
        id: { type: string }
        points:
          type: integer
          description: May be negative (adjustments). 0 for `scorecard`, which contributes `score` to the mean instead.
        reason: { type: string, enum: [visit_submitted, task_closed, scorecard] }
        sourceType: { type: string, enum: [visit, task, scorecard] }
        sourceId: { type: string }
        score: { type: number, nullable: true, description: The scorecard weightedTotal; null for other reasons. }
        occurredAt: { type: string, format: date-time }
        outletName: { type: string, nullable: true }
    ContestInput:
      type: object
      required: [name, startDate, endDate]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 2000, description: Blank is stored as null. }
        prizeDescription: { type: string, nullable: true, maxLength: 2000, description: Free text. Blank is stored as null. }
        startDate: { type: string, format: date, example: '2026-10-01' }
        endDate: { type: string, format: date, example: '2026-10-31' }
        territoryId: { type: string, nullable: true, description: Scope to agents assigned to this territory. Null for the whole client. }
        eventTypes:
          type: array
          nullable: true
          description: Ledger reasons that count. Omitted, null or empty means all of them.
          items: { type: string, enum: [visit_submitted, task_closed, scorecard] }
    ContestPatch:
      type: object
      description: Any subset of ContestInput's fields, at least one.
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 2000 }
        prizeDescription: { type: string, nullable: true, maxLength: 2000 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        territoryId: { type: string, nullable: true }
        eventTypes:
          type: array
          nullable: true
          items: { type: string, enum: [visit_submitted, task_closed, scorecard] }
    Contest:
      type: object
      description: >
        A time-boxed contest over the points ledger (#124). `status` is computed
        from the dates and the client's local today, except `cancelled`, which a
        manager sets.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        prizeDescription: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        territoryId: { type: string, nullable: true }
        territory:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            code: { type: string }
        eventTypes:
          type: array
          description: Empty means every reason counts.
          items: { type: string, enum: [visit_submitted, task_closed, scorecard] }
        status: { type: string, enum: [upcoming, active, ended, cancelled] }
        daysLeft: { type: integer, nullable: true, description: Local days left counting today (1 on the last day) while active; null otherwise. }
        window:
          type: object
          description: The contest's local days as instants, half-open [from, to).
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContestStanding:
      type: object
      description: >
        One agent's row. Points = mean(score of counted `scorecard` entries) +
        sum(points of counted entries) inside the window, so with no event-type
        filter they equal the leaderboard's points over the same days. The board
        lists field agents in scope (assigned to the territory, when scoped) who
        are active, plus deactivated agents who earned counted entries in the
        window. Ties share a rank (1, 1, 3) and are listed by email, then id.
      properties:
        rank: { type: integer }
        agentId: { type: string }
        email: { type: string }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        points: { type: number }
        visitsSubmitted: { type: integer }
        tasksClosed: { type: integer }
        avgScorecard: { type: number }
    ContestStandings:
      type: object
      properties:
        contest: { $ref: '#/components/schemas/Contest' }
        participantCount: { type: integer }
        standings: { type: array, items: { $ref: '#/components/schemas/ContestStanding' } }
    CurrentContest:
      allOf:
        - { $ref: '#/components/schemas/Contest' }
        - type: object
          properties:
            participantCount: { type: integer }
            standings:
              type: array
              description: The top 10 rows.
              items: { $ref: '#/components/schemas/ContestStanding' }
            me:
              description: The caller's own row; null for callers who are not on the board.
              nullable: true
              allOf: [{ $ref: '#/components/schemas/ContestStanding' }]
    GamificationMe:
      allOf:
        - { $ref: '#/components/schemas/LeaderboardEntry' }
        - type: object
          properties:
            recentEntries: { type: array, items: { $ref: '#/components/schemas/PointsLedgerEntry' } }
    AgentPointsHistory:
      type: object
      properties:
        agent:
          type: object
          properties:
            agentId: { type: string }
            email: { type: string }
            displayName: { $ref: '#/components/schemas/DisplayName' }
        data: { type: array, items: { $ref: '#/components/schemas/PointsLedgerEntry' } }
        nextCursor: { type: string, nullable: true }
    Webhook:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        url: { type: string }
        event: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        consecutiveFailures:
          type: integer
          description: Deliveries that gave up since the last successful one.
        lastDeliveryStatus:
          type: string
          nullable: true
          enum: [pending, succeeded, failed_retrying, gave_up]
        lastDeliveryAt: { type: string, format: date-time, nullable: true }
        health:
          type: string
          enum: [healthy, failing, unhealthy]
          description: >
            unhealthy while consecutiveFailures > 0; failing when the latest
            delivery is waiting on a retry; healthy otherwise.
    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        webhookId: { type: string }
        clientId: { type: string }
        event: { type: string }
        payload:
          type: object
          description: The exact `{ event, payload, timestamp }` body sent on every attempt.
        status: { type: string, enum: [pending, succeeded, failed_retrying, gave_up] }
        attempts: { type: integer }
        lastStatusCode: { type: integer, nullable: true }
        lastError: { type: string, nullable: true }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ReportSchedule:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        reportDefinitionId: { type: string }
        cadence: { type: string, enum: [daily, weekly] }
        recipients:
          type: array
          items: { type: string }
          description: >
            Email addresses each run is emailed to, when SMTP is configured.
            Schedules created before addresses were validated may hold other
            strings; the email channel skips those and names them in its
            outcome's `detail`.
        active: { type: boolean }
        lastRunAt: { type: string, format: date-time, nullable: true, description: The latest run, scheduled or manual. }
        nextRunAt: { type: string, format: date-time, nullable: true, description: When the worker next fires it; null while paused. }
        claimedUntil: { type: string, format: date-time, nullable: true, description: Internal claim lease held by a worker mid-run. }
        createdAt: { type: string, format: date-time }
    ReportDeliveryOutcome:
      type: object
      description: What one delivery channel did with one run.
      required: [channel, status, targets]
      properties:
        channel: { type: string, enum: [webhook, email] }
        status:
          type: string
          enum: [queued, no_subscribers, not_configured, failed]
          description: >
            queued — delivery rows were created and retry on failure (see the
            webhook's delivery log, or the run's email-deliveries);
            no_subscribers — no active webhook is subscribed to
            report.generated, or the schedule has no valid email address;
            not_configured — email (SMTP) is not set up on this deployment,
            with the reason in `detail`; failed — the channel errored before
            queuing anything.
        targets:
          type: array
          items: { type: string }
          description: >
            Webhook URLs queued to; for email, the addresses queued to (or, when
            not_configured, the stored recipients).
        webhookDeliveryIds: { type: array, items: { type: string } }
        emailDeliveryIds:
          type: array
          items: { type: string }
          description: The email delivery rows created, one per recipient (email channel only).
        detail:
          type: string
          description: Why, for any status but queued; for queued email, which stored entries were skipped as not email addresses.
    ScheduleRunResult:
      type: object
      properties:
        schedule: { $ref: '#/components/schemas/ReportSchedule' }
        runId: { type: string }
        trigger: { type: string, enum: [manual, scheduled] }
        generatedAt: { type: string, format: date-time }
        rowCount: { type: integer }
        deliveredTo:
          type: array
          items: { type: string }
          description: >
            Every target something was queued to: the webhook URLs a
            report.generated delivery was created for, then the email addresses
            an email was queued to. Empty when nothing was sent. Not an echo of
            `recipients`.
        deliveries: { type: array, items: { $ref: '#/components/schemas/ReportDeliveryOutcome' } }
    ReportGeneratedPayload:
      type: object
      description: >
        The `payload` of a `report.generated` webhook event (inside the usual
        `{ event, payload, timestamp }` envelope). A pointer to the report, not
        its rows: reports have no row cap and the body is stored and re-sent on
        every retry, so it stays a few hundred bytes. Fetch the rows from
        `csvDownloadUrl` (signed, no token needed) or from `csvPath` with a
        manager/admin bearer token. De-duplicate on `runId`.
      properties:
        scheduleId: { type: string }
        reportId: { type: string, description: The report definition id. }
        reportName: { type: string }
        reportType: { type: string, enum: [visits, scorecards, tasks, orders] }
        runId: { type: string }
        trigger: { type: string, enum: [manual, scheduled] }
        generatedAt: { type: string, format: date-time }
        rowCount: { type: integer }
        csvPath: { type: string, example: '/report-schedules/{id}/runs/{runId}/csv' }
        csvUrl:
          type: string
          nullable: true
          description: csvPath on the PUBLIC_API_URL origin when that is configured; otherwise null.
        csvDownloadUrl:
          type: string
          nullable: true
          example: 'https://tradeiq-backend.fly.dev/report-downloads/{token}'
          description: >
            Added in #66 (additive). A signed, time-limited link to this run's
            CSV that needs no bearer token (`GET /report-downloads/{token}`).
            Scoped to this run of this client; the same link is issued on every
            retry. Null unless PUBLIC_API_URL and REPORT_LINK_SECRET are
            configured.
        csvDownloadExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When `csvDownloadUrl` stops working (7 days after `generatedAt`); null with it.
    ReportRunHistoryItem:
      type: object
      description: One run of a report schedule, with where its delivery stands (#66).
      properties:
        id: { type: string }
        scheduleId: { type: string }
        trigger: { type: string, enum: [manual, scheduled] }
        status:
          type: string
          enum: [delivering, delivered, partial, failed, not_sent]
          description: >
            delivering — a webhook or email delivery is still queued or
            retrying; delivered — something was delivered and nothing failed;
            partial — some deliveries succeeded and some failed; failed —
            deliveries or a channel failed and nothing succeeded; not_sent —
            nothing was queued (see `reason`).
        dueAt: { type: string, format: date-time, nullable: true, description: The due time a scheduled run fired for; null for a manual run. }
        generatedAt: { type: string, format: date-time }
        rowCount: { type: integer }
        createdAt: { type: string, format: date-time }
        reason:
          type: string
          nullable: true
          description: Why something was not sent or failed (each channel's detail, and counts of deliveries that gave up); null when there is nothing to explain.
        summary:
          type: object
          properties:
            webhook:
              type: object
              properties:
                status: { type: string, nullable: true, enum: [queued, no_subscribers, not_configured, failed] }
                delivered: { type: integer }
                failed: { type: integer, description: Deliveries that gave up after every retry. }
                pending: { type: integer, description: Queued or retrying. }
            email:
              type: object
              properties:
                status: { type: string, nullable: true, enum: [queued, no_subscribers, not_configured, failed] }
                sent: { type: integer }
                failed: { type: integer, description: Emails that gave up. }
                pending: { type: integer, description: Queued or retrying. }
                notConfigured: { type: integer, description: Recipients not emailed because SMTP was not configured for the run. }
        deliveries: { type: array, items: { $ref: '#/components/schemas/ReportDeliveryOutcome' } }
        webhookDeliveries:
          type: array
          description: The run's webhook deliveries as they stand now. A webhook deleted since the run is no longer listed.
          items:
            type: object
            properties:
              id: { type: string }
              webhookId: { type: string }
              url: { type: string }
              status: { type: string, enum: [pending, succeeded, failed_retrying, gave_up] }
              attempts: { type: integer }
              lastStatusCode: { type: integer, nullable: true }
              lastError: { type: string, nullable: true }
              lastAttemptAt: { type: string, format: date-time, nullable: true }
              nextAttemptAt: { type: string, format: date-time, nullable: true }
              deliveredAt: { type: string, format: date-time, nullable: true }
        csvDownloadUrl:
          type: string
          nullable: true
          description: The run's signed CSV link (`GET /report-downloads/{token}`); null when links are not configured or the link has expired.
        csvDownloadExpiresAt: { type: string, format: date-time, nullable: true }
    ReportEmailDelivery:
      type: object
      description: One report run emailed to one recipient (#66), with the webhook delivery retry semantics.
      properties:
        id: { type: string }
        runId: { type: string }
        clientId: { type: string }
        recipient: { type: string, format: email }
        status: { type: string, enum: [pending, succeeded, failed_retrying, gave_up] }
        attempts: { type: integer }
        lastError: { type: string, nullable: true, description: 'The last SMTP error, or why email gave up (e.g. SMTP no longer configured).' }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        csvAttached:
          type: boolean
          nullable: true
          description: Whether the delivered email carried the CSV (false means link only, over the 5 MB cap). Null until delivered.
        createdAt: { type: string, format: date-time }
    TrendPoint:
      type: object
      required: [period, value, count]
      properties:
        period:
          type: string
          format: date-time
          description: >-
            The bucket's first calendar date in the client's timezone
            (Client.timezone, #309; Monday for weeks), encoded as UTC midnight of
            that date — the same convention as a beat plan's scheduledDate. It
            labels a local day; it is not the instant that day began.
        value: { type: number }
        count: { type: integer }
    BenchmarkSeries:
      type: object
      required: [average, count, points]
      properties:
        average: { type: number, nullable: true, description: 'Metric over the whole window; null when nothing was measured' }
        count: { type: integer }
        points: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } }
    TerritoryBenchmark:
      allOf:
        - $ref: '#/components/schemas/BenchmarkSeries'
        - type: object
          required: [territoryId, territoryName, territoryCode, rank, deltaFromClient, position]
          properties:
            territoryId: { type: string }
            territoryName: { type: string }
            territoryCode: { type: string }
            rank: { type: integer, nullable: true, description: '1-based by average, highest first; null without data' }
            deltaFromClient: { type: number, nullable: true, description: 'average minus the client average' }
            position: { type: string, nullable: true, enum: [above, below, level] }
    TerritoryBenchmarkReport:
      type: object
      required: [metric, interval, unit, target, client, unassigned, territories]
      properties:
        metric: { type: string, enum: [perfectStore, availability, scorecards, shareOfShelf] }
        interval: { type: string, enum: [day, week] }
        unit: { type: string, enum: [score, percent] }
        target:
          type: object
          nullable: true
          description: "The client's configured standard for the metric (scorecards: kpiThresholds.green)"
          properties:
            value: { type: number }
            label: { type: string }
        client: { $ref: '#/components/schemas/BenchmarkSeries' }
        unassigned:
          type: object
          description: Rows whose outlet matches no territory of the client (included in client)
          properties:
            count: { type: integer }
        territories: { type: array, items: { $ref: '#/components/schemas/TerritoryBenchmark' } }
    PushDevice:
      type: object
      required: [platform, lastSeenAt]
      properties:
        platform: { type: string, enum: [android, ios, web] }
        lastSeenAt: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      required: [alerts, tasks, messages, sla]
      properties:
        alerts: { type: boolean }
        tasks: { type: boolean }
        messages: { type: boolean }
        sla: { type: boolean }
    PushPayload:
      type: object
      description: >
        Not an endpoint: the shape of a push the server sends through FCM (#67).
        notification carries a one-line title and a body of at most 140
        characters, holding only what the recipient can already see in the app.
        data.route is the in-app route to open on tap (/alerts, /tasks, /today
        or /messages).
      properties:
        notification:
          type: object
          properties:
            title: { type: string }
            body: { type: string }
        data:
          type: object
          required: [route, category]
          properties:
            route: { type: string }
            category: { type: string, enum: [alerts, tasks, messages, sla] }
    CapturedAt:
      type: string
      format: date-time
      description: >
        When the DEVICE took the order (#338) — as opposed to `createdAt`, which
        is when the server received it. These differ whenever an order is
        captured offline, and `capturedAt` is the one every "which day or month
        is this order in" rule reads: sell-in months and attainment (#119), the
        demand forecast's day buckets, campaign attribution (#324) and the
        orders report's date window.


        Clamped on the way in, because a device clock can be wrong: no more
        than 10 minutes ahead of the server and no older than 90 days (the same
        bounds as a location ping's `recordedAt`). A value outside that, one
        that is not a full ISO-8601 instant with a `Z` or numeric offset, or
        none at all, falls back to the received time and is logged. Never null
        on a stored order — rows that predate the field were backfilled from
        `createdAt`.
    OrderLine:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        skuId: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
    OrderCreate:
      type: object
      required: [outletId, lines]
      properties:
        outletId: { type: string }
        visitId: { type: string, description: 'The visit this order was taken during, when there was one' }
        capturedAt: { $ref: '#/components/schemas/CapturedAt' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, quantity, unitPrice]
            properties:
              skuId: { type: string }
              quantity: { type: integer, minimum: 1, description: 'a whole number above 0' }
              unitPrice: { type: number, minimum: 0 }
    Order:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        outletId: { type: string }
        agentId: { type: string }
        visitId: { type: string, nullable: true }
        campaignId:
          type: string
          nullable: true
          description: >
            Stamped at creation from the order's `capturedAt`, never
            back-filled. Null when the outlet was in no active campaign that
            day (#324).
        status: { type: string, enum: [submitted, confirmed, cancelled] }
        total: { type: number, description: 'sum of quantity x unitPrice, 2dp' }
        createdAt: { type: string, format: date-time, description: 'when the server received the order' }
        capturedAt: { $ref: '#/components/schemas/CapturedAt' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
    SkuForecast:
      type: object
      required: [skuId, method, historySource, historyDays, historyPoints, forecastNextPeriod, forecastCoverageDays]
      properties:
        skuId: { type: string }
        method: { type: string, enum: [exponential_smoothing] }
        historySource: { type: string, enum: [sell_in_orders], description: 'Order-derived sell-in (#119), not VisitStock.salesActual' }
        historyDays: { type: integer, example: 28 }
        historyPoints: { type: array, items: { type: number }, description: 'Units ordered per local day, oldest first, zero-filled' }
        forecastNextPeriod: { type: number, description: Forecast units for the next local day }
        forecastCoverageDays: { type: number, nullable: true, description: 'Latest on-shelf units / forecast daily demand; null when demand is zero' }
    SalesTargetRef:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
    SalesTarget:
      type: object
      required: [id, skuId, sku, month, scope, territoryId, territory, outletId, outlet, targetUnits, createdById, createdAt, updatedAt]
      properties:
        id: { type: string }
        skuId: { type: string }
        sku:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        month: { type: string, example: '2026-09', description: 'YYYY-MM; the whole month of local days in Client.timezone' }
        scope: { type: string, enum: [client, territory, outlet] }
        territoryId: { type: string, nullable: true }
        territory: { allOf: [{ $ref: '#/components/schemas/SalesTargetRef' }], nullable: true }
        outletId: { type: string, nullable: true }
        outlet: { allOf: [{ $ref: '#/components/schemas/SalesTargetRef' }], nullable: true }
        targetUnits: { type: integer, minimum: 0, description: Units of sell-in (orders) }
        createdById: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SalesTargetImportResult:
      type: object
      required: [dryRun, totalRows, validRows, invalidRows, errors, rows, created, updated]
      properties:
        dryRun: { type: boolean }
        totalRows: { type: integer, description: Non-blank data rows read }
        validRows: { type: integer }
        invalidRows: { type: integer, description: Distinct rows with at least one error }
        errors:
          type: array
          items:
            type: object
            required: [row, column, message]
            properties:
              row: { type: integer, description: '1-based CSV row; the header is row 1' }
              column: { type: string, nullable: true, enum: [month, sku, targetUnits, territory, outlet, null] }
              message: { type: string }
        rows:
          type: array
          description: The valid rows, as they are (or would be) written
          items:
            type: object
            required: [row, skuId, skuName, month, scope, territoryId, territoryCode, outletId, outletCode, targetUnits, action]
            properties:
              row: { type: integer }
              skuId: { type: string }
              skuName: { type: string }
              month: { type: string, example: '2026-09' }
              scope: { type: string, enum: [client, territory, outlet] }
              territoryId: { type: string, nullable: true }
              territoryCode: { type: string, nullable: true }
              outletId: { type: string, nullable: true }
              outletCode: { type: string, nullable: true }
              targetUnits: { type: integer }
              action: { type: string, enum: [create, update] }
        created: { type: integer, description: 'Targets created (predicted on a dry run)' }
        updated: { type: integer, description: 'Existing targets replaced (predicted on a dry run)' }
    SalesAttainmentLevel:
      type: object
      required: [targets, targetUnits, actualUnits, attainmentPct]
      properties:
        targets: { type: integer }
        targetUnits: { type: integer }
        actualUnits: { type: integer, description: Sell-in units of the targeted SKU-scopes }
        attainmentPct: { type: number, nullable: true }
    SalesAttainmentReport:
      type: object
      required: [month, timeZone, from, to, metric, metricLabel, skus, summary, truncated]
      properties:
        month: { type: string, example: '2026-09' }
        timeZone: { type: string, example: Africa/Johannesburg }
        from: { type: string, format: date-time, description: 'Instant the month begins locally (inclusive)' }
        to: { type: string, format: date-time, description: 'Instant the next month begins locally (exclusive)' }
        metric: { type: string, enum: [sell_in_units] }
        metricLabel: { type: string, enum: ['Sell-in (orders)'] }
        skus:
          type: array
          items:
            type: object
            required: [skuId, skuName, category, targetId, targetUnits, actualUnits, attainmentPct, scoped]
            properties:
              skuId: { type: string }
              skuName: { type: string }
              category: { type: string }
              targetId: { type: string, nullable: true, description: The client-wide target, if set }
              targetUnits: { type: integer, nullable: true }
              actualUnits: { type: integer, description: All of the client's sell-in of this SKU in the month }
              attainmentPct: { type: number, nullable: true }
              scoped:
                type: array
                items:
                  type: object
                  required: [targetId, scope, territory, outlet, targetUnits, actualUnits, attainmentPct]
                  properties:
                    targetId: { type: string }
                    scope: { type: string, enum: [territory, outlet] }
                    territory: { allOf: [{ $ref: '#/components/schemas/SalesTargetRef' }], nullable: true }
                    outlet: { allOf: [{ $ref: '#/components/schemas/SalesTargetRef' }], nullable: true }
                    targetUnits: { type: integer }
                    actualUnits: { type: integer }
                    attainmentPct: { type: number, nullable: true }
        summary:
          type: object
          description: >-
            Totals per scope level, never added across levels (a client-wide and a
            territory target for one SKU count the same orders).
          required: [client, territory, outlet]
          properties:
            client: { $ref: '#/components/schemas/SalesAttainmentLevel' }
            territory: { $ref: '#/components/schemas/SalesAttainmentLevel' }
            outlet: { $ref: '#/components/schemas/SalesAttainmentLevel' }
        truncated: { type: boolean, description: 'More than 1000 SKUs; the list was cut' }
