openapi: 3.0.3
info:
  title: TradeIQ API
  version: 0.1.0
  description: >
    Phase 1 (complete). Implemented: /auth, /outlets, /skus, /visits (check-in
    + submit + list), /stock (S2), /visibility (S3-S4, vision-stub wired),
    /pricing (S5, OCR-stub wired), /competitive (S6), /capability (S7), /risks
    (S8), /tasks (S9), /scorecards (S10), /dashboard, and /photos (photo
    capture + photo-verified task closure). Every mounted route is implemented
    — no route returns 501. Manager-facing GET listings on the per-visit
    section modules follow a common contract: GET /<section>?visitId=<id>
    returns that visit's captured rows (any authenticated role, tenant-scoped,
    400 if visitId is missing, 404 if the visit is not the caller's). All
    non-auth/non-health routes require a Bearer JWT; write routes are
    role-guarded (403 when the caller's role is not permitted).
    Phase 3 (Activation) adds /territories, /campaigns, /beatplans, /alerts,
    /templates, and /trends — see docs/architecture/phase3-activation.md.
    Phase 2 (Intelligence) adds /fraud, /dispatch, /forecast; Phase 3 Tier-2
    adds /orders, /messages, /announcements, /webhooks, /gamification, /reports
    — see docs/architecture/phase2-intelligence.md.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: >
                    Matched case-insensitively and with surrounding whitespace
                    ignored, so "Agent@Example.com" and " agent@example.com "
                    both reach the same account. The password is NOT trimmed.
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [field_agent, manager, admin] }
        '401':
          description: Invalid credentials
  /auth/change-password:
    post:
      summary: Change your own password (#400)
      description: >
        The signed-in user changes their own password; the current one is
        re-checked. Rate-limited per user. The caller's token stays valid and
        no new token is issued. **Other sessions are NOT ended**: tokens are
        stateless 12h JWTs, so a token minted before the change keeps working
        until it expires. The response says so in `otherSessionsEnded: false`.
        To cut a lost phone off immediately, deactivate the account
        (PATCH /users/{id} with active false), which requireAuth does check.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChangeResult' }
        '400': { description: The new password breaks the password rule; the body states the rule, never the input }
        '401':
          description: >
            The current password is wrong (`code: current_password_incorrect`),
            or the token is missing/expired (no `code`).
        '429': { description: Too many attempts }
  /auth/reset-password:
    post:
      summary: Redeem a manager-issued reset code and choose a new password (#400)
      description: >
        Unauthenticated by necessity. Every failure — unknown email, no live
        code, wrong/expired/spent/malformed code, deactivated account — gets
        the identical 401 body, so the route cannot be used to discover
        accounts. A code dies after 5 wrong guesses, at its expiry (15 minutes
        by default), on use, when a newer code is issued, and when the
        password is changed by any other route. Rate-limited per email and per
        IP. Other sessions are not ended (see /auth/change-password).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { type: string }
                code:
                  type: string
                  description: Eight digits. Spaces and hyphens are ignored ("4821 7390").
                newPassword: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Password set; sign in with it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordChangeResult' }
        '400': { description: The new password breaks the password rule, or a field is missing }
        '401':
          description: 'Always `{ error: "That reset code is not valid or has expired", code: reset_code_invalid }`'
        '429': { description: Too many attempts for this email or from this address }
  /outlets:
    get:
      summary: List outlets for the authenticated user's client
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of outlets
          content:
            application/json:
              schema:
                type: array
        '401':
          description: Missing or invalid token
    post:
      summary: Create an outlet
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, channelType, lat, lng, territoryId]
              properties:
                name: { type: string }
                code: { type: string }
                channelType: { type: string }
                lat: { type: number }
                lng: { type: number }
                territoryId: { type: string }
                teamProfile: { type: object }
      responses:
        '201':
          description: Outlet created
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing required fields (name, code, channelType, lat, lng, territoryId)
        '401':
          description: Missing or invalid token
        '403':
          description: Caller's role may not create outlets (manager/admin only)
        '409':
          description: An outlet with this code already exists
  /outlets/pin-disputes:
    get:
      summary: The manager's queue of "the pin is wrong" claims (#386)
      description: >
        Agents' reports that an outlet is pinned in the wrong place, newest
        first, as a standard keyset page `{ data, nextCursor }`. Each row
        carries the agent's actual position, the distance from the pin
        (measured server-side), the pin AS IT READ when the claim was made, the
        note they typed, and metadata for any storefront photo they attached
        (section `pin_dispute`; never the bytes). Defaults to the OPEN queue, so
        that answering a claim takes it off the list. Manager/admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, applied, rejected, all] }
        - name: outletId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Pin disputes (newest first)
        '400':
          description: Invalid status, outletId, limit or cursor
        '401':
          description: Missing or invalid token
        '403':
          description: Caller's role may not read the queue (manager/admin only)
  /outlets/{id}:
    get:
      summary: One outlet with the evidence about its pin (#386)
      description: >
        The outlet, its rejected check-in attempts (each agent's real position
        and measured distance), the pin disputes filed against it, and the
        ledger of who has changed it. Manager/admin only — agents keep the
        unchanged list at GET /outlets. Another tenant's id is a 404, never a
        403.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Outlet detail with attempt, dispute and change evidence
        '401':
          description: Missing or invalid token
        '403':
          description: Caller's role may not read outlet detail (manager/admin only)
        '404':
          description: No such outlet in the caller's client
    patch:
      summary: Correct a wrongly pinned outlet (#386)
      description: >
        Moves the pin, renames the outlet, or retires it, writing an audit row
        in the same transaction. Coordinates come from exactly one source and
        the body must say which - `lat` + `lng` (typed in, and they move
        together or not at all) or `fromAttemptId` (the agent's recorded
        position, read out of that CheckInAttempt server-side). Sending both is
        a 400. Naming a `disputeId` resolves that claim in the same
        transaction: `applied` when the pin moved, `rejected` when it did not.
        Manager/admin only - an agent who could both file a dispute and grant it
        could move any outlet's fence to wherever they are standing.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                status: { type: string, enum: [active, closed] }
                fromAttemptId: { type: string }
                disputeId: { type: string }
                resolutionNote: { type: string }
      responses:
        '200':
          description: The updated outlet, plus `dispute` when one was resolved
        '400':
          description: >
            Unknown field, lat without lng, both lat/lng and fromAttemptId, or
            an empty body
        '401':
          description: Missing or invalid token
        '403':
          description: Caller's role may not edit outlets (manager/admin only)
        '404':
          description: No such outlet, check-in attempt or dispute in the caller's client
        '409':
          description: That pin dispute was already resolved
  /skus:
    get:
      summary: List SKUs for the authenticated user's client
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of SKUs
          content:
            application/json:
              schema:
                type: array
        '401':
          description: Missing or invalid token
  /visits:
    get:
      summary: List visits (field_agent sees own; manager/admin sees the client's)
      description: >
        Rows are whole Visit records. Since #379 each also carries
        `resumedFromDraft` (false for a fresh check-in and for every visit
        recorded before the field existed) and `clientVisitId` (the device's
        idempotency key, null when the app sent none).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: outletId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [in_progress, submitted] }
      responses:
        '200':
          description: Visits (newest check-in first)
        '400':
          description: Invalid status filter
        '401':
          description: Missing or invalid token
    post:
      summary: Geofenced outlet check-in (creates a Visit) — field_agent only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId, lat, lng]
              properties:
                outletId: { type: string }
                lat: { type: number }
                lng: { type: number }
                checkinTs:
                  type: string
                  format: date-time
                  description: Client-captured check-in time (offline-first); server clock if omitted.
                clientVisitId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9._:-]+$'
                  description: >
                    The DEVICE's own id for this visit — its idempotency key (#379, #385).
                    Optional. When given, a retry after a lost response returns the visit
                    already stored under this key instead of creating a second one, and
                    writes no second CheckInAttempt row. Unique per agent, so two agents'
                    local uuids never collide. Same shape as `clientMessageId` on POST /messages.
                resumed:
                  type: boolean
                  default: false
                  description: >
                    True when the agent RESUMED a saved draft rather than checking in fresh
                    (#379). Persisted as `resumedFromDraft` and returned on GET /visits and
                    GET /visits/{id}. Defaults false, which is what a fresh check-in — and
                    every older app build — honestly is.
                pinDispute:
                  type: object
                  additionalProperties: false
                  properties:
                    note: { type: string, maxLength: 1000 }
                  description: >
                    "The pin is wrong" (#386). Present, a check-in that FAILS the geofence
                    is allowed through as a recorded override instead of being rejected:
                    the visit is created with `geofencePass: FALSE` and a PinDispute row
                    beside it in one transaction, holding the agent's position, the distance
                    measured server-side (never taken from the device), and the outlet's pin
                    frozen as it read at the time. It is not a bypass — the fraud engine
                    scores it (`geofence_override`), the manager's queue at
                    GET /outlets/pin-disputes lists it, and only a manager can act on it by
                    moving the pin through PATCH /outlets/{id}. Refused with 422 beyond the
                    client's `pinDisputeMaxDistanceM` (default 25000 m). A storefront photo
                    is attached afterwards through the ordinary photo upload against the
                    created visit, under section `pin_dispute`. Ignored on a check-in that
                    passes the fence.
      responses:
        '200':
          description: >
            A visit already existed for this (agent, clientVisitId): the ORIGINAL visit is
            returned, unchanged, with `deduplicated: true` and an `Idempotent-Replayed: true`
            header. Nothing was created, no CheckInAttempt row was written, and the agent's
            last-known location was not moved — a retry is not a second check-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInResponse' }
        '201':
          description: Visit created (status in_progress)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInResponse' }
        '400':
          description: Missing outletId, lat, or lng; or a malformed clientVisitId or resumed
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Outlet not found for this client
        '422':
          description: Check-in location is outside the outlet geofence
  /visits/me:
    get:
      summary: The caller's OWN visits — the agent's record (#383)
      description: >
        Self-scoped by construction: the agent id and client id come off the
        token and are never parameters, so no query string returns another
        agent's visits (an `agentId` query parameter is ignored). Open to every
        signed-in role; a caller with no visits gets an empty page. Registered
        before `/visits/{id}`, so `me` is never read as a visit id.

        Each row is the proof and the number, not the fraud engine's inputs:
        outlet, check-in time, metres from the pin (null = not measured, never
        0), dwell on the device's clock (null when there is no client submit
        stamp), sections captured of 7, photos, tasks raised, the server's
        score, and — kept apart, never overwriting it — the score the device
        showed the agent (`score.seen`, null when none was recorded). A
        reviewer's verdict is included as a fact; the risk score and signals
        are not.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 30, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of the caller's visits, newest check-in first
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  nextCursor: { type: string, nullable: true }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, outletId, outletName, outletCode, checkinTs, checkinDistanceM, geofencePass, status, dwellMinutes, sectionsCaptured, sectionsTotal, photos, tasksRaised, score, reviewedVerdict, pinReported]
                      properties:
                        id: { type: string }
                        outletId: { type: string }
                        outletName: { type: string }
                        outletCode: { type: string }
                        checkinTs: { type: string, format: date-time }
                        checkinDistanceM: { type: number, nullable: true }
                        geofencePass: { type: boolean }
                        status: { type: string, enum: [in_progress, submitted] }
                        dwellMinutes: { type: integer, nullable: true }
                        sectionsCaptured: { type: integer }
                        sectionsTotal: { type: integer }
                        photos: { type: integer }
                        tasksRaised: { type: integer }
                        score:
                          type: object
                          nullable: true
                          required: [weightedTotal, ratingBand, scoredAt, seen]
                          properties:
                            weightedTotal: { type: number }
                            ratingBand: { type: string }
                            scoredAt: { type: string, format: date-time }
                            seen:
                              type: object
                              nullable: true
                              required: [weightedTotal, ratingBand, seenAt]
                              properties:
                                weightedTotal: { type: number }
                                ratingBand: { type: string }
                                seenAt: { type: string, format: date-time, nullable: true }
                        reviewedVerdict: { type: string, nullable: true }
                        pinReported:
                          type: boolean
                          description: The agent started this visit by reporting the outlet's pin as wrong (#386).
        '400':
          description: Invalid limit or a repeated cursor
        '401':
          description: Missing or invalid token
  /visits/{id}:
    get:
      summary: One visit, for manager review — manager/admin, tenant-scoped (#208)
      description: >
        Outlet, agent, device check-in and submit times, geofence distance, the
        perfect-store score with every dimension (null = not measurable), a
        summary per capture section, photo METADATA with thumbnail URLs, and the
        visit's fraud signals. Photo bytes are never included; fetch each
        thumbnail from `thumbnailUrl` (GET /photos/{id}/thumbnail). A draft
        (in_progress) visit returns `submittedAtClient: null` and, until scored,
        `score: null`. Section rows are read up to 500 each and photos up to
        200; `count`/`total` are always exact and `truncated` marks a section
        whose findings came from fewer rows than exist.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The visit detail
          content:
            application/json:
              schema:
                type: object
                required: [id, status, outlet, agent, checkinTs, submittedAtClient, resumedFromDraft, geofence, score, sections, photos, fraud]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [in_progress, submitted] }
                  outlet:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      code: { type: string }
                      channelType: { type: string }
                  agent:
                    type: object
                    description: User has no display-name column, so the email is the agent's name.
                    properties:
                      id: { type: string }
                      email: { type: string }
                  checkinTs: { type: string, format: date-time, description: Device clock at check-in }
                  submittedAtClient:
                    type: string
                    format: date-time
                    nullable: true
                    description: Device clock at submit; null for a draft or a visit recorded before it existed
                  resumedFromDraft:
                    type: boolean
                    description: >
                      True when the agent RESUMED a saved draft rather than checking in fresh
                      (#379). A resumed visit's check-in happened earlier and its dwell spans
                      an interruption, so without this a paused visit and an idle agent are
                      indistinguishable on the timeline. False for every visit recorded
                      before it existed.
                  geofence:
                    type: object
                    properties:
                      pass: { type: boolean }
                      distanceM: { type: number, nullable: true }
                  score:
                    type: object
                    nullable: true
                    properties:
                      weightedTotal: { type: number }
                      ratingBand: { type: string, enum: [green, amber, red] }
                      target: { type: number, description: "The client's current green threshold" }
                      scoredAt:
                        type: string
                        format: date-time
                        description: >
                          When the SERVER computed `weightedTotal`. Reads Scorecard.scoredAt,
                          not createdAt — createdAt survives the regenerate upsert and so named
                          when the FIRST score was written, not this one (#390).
                      provisional:
                        type: object
                        nullable: true
                        description: >
                          The score the DEVICE showed the agent before the server recomputed
                          (#390, #399). NULL means "we do not know what they saw" — no client
                          sent one — and must never render as 0. Never an input to anything:
                          no KPI, aggregate or scorecard maths reads it.
                        required: [weightedTotal, ratingBand, seenAt]
                        properties:
                          weightedTotal: { type: number, minimum: 0, maximum: 100 }
                          ratingBand: { type: string, enum: [green, amber, red] }
                          seenAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: The device clock when it showed that score; null when the client sent none
                      dimensions:
                        type: array
                        items:
                          type: object
                          properties:
                            key: { type: string, enum: [availability, visibility, display, pricing, competitive, salesCapability] }
                            score: { type: number, nullable: true }
                  sections:
                    type: array
                    description: Always the five sections, in this order - stock, visibility, pricing, competitive, risks.
                    items:
                      type: object
                      properties:
                        key: { type: string, enum: [stock, visibility, pricing, competitive, risks] }
                        count: { type: integer }
                        flagged: { type: integer, description: Rows needing attention }
                        findings: { type: array, maxItems: 3, items: { type: string } }
                        truncated: { type: boolean }
                  photos:
                    type: object
                    properties:
                      total: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            section: { type: string }
                            timestamp: { type: string, format: date-time }
                            thumbnailUrl: { type: string, example: /photos/3f2a.../thumbnail }
                  fraud:
                    type: object
                    properties:
                      riskScore: { type: number, minimum: 0, maximum: 100 }
                      signals:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string }
                            detail: { type: string }
                            weight: { type: number }
                  templateResponses:
                    type: array
                    description: >
                      The visit's answers to its client's audit template (#122) —
                      the client-questions section that supplements S1–S10. Empty
                      when there are none. `schema` is the template's CURRENT
                      schema (no version history is kept), for resolving question
                      labels; compare `templateVersion` with `currentVersion`.
                      Never part of `score`.
                    items:
                      type: object
                      properties:
                        templateId: { type: string }
                        templateName: { type: string }
                        templateVersion: { type: integer, description: The version the answers were given against }
                        currentVersion: { type: integer }
                        schema: { type: object, additionalProperties: true }
                        answers: { type: object, additionalProperties: true, description: Keyed by the schema's field ids }
                        recordedAt: { type: string, format: date-time }
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a manager or admin
        '404':
          description: Visit not found for this client
  /visits/{id}/submit:
    post:
      summary: Mark a visit submitted — field_agent, owner only
      description: >-
        After the visit is persisted, submit also (best-effort — none of these
        can fail a submission that has already been saved): marks the agent's
        beat-plan stops for this outlet visited (#52), on plans of the same
        client and agent that are not completed and whose scheduledDate is the
        calendar date of the visit's device check-in time (checkinTs) in the
        client's timezone (Client.timezone, #309) — so a 00:30 SAST check-in
        counts toward that day's plan, not the previous one. scheduledDate is a
        calendar date stored as UTC midnight, and is compared as a date, not
        an instant. Idempotent, so a re-submit or duplicate sync changes nothing; fires the
        visit.submitted webhook; and evaluates the client's active alert rules.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Visit updated (status submitted)
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit not found for this client/agent
  /stock:
    post:
      summary: Record per-SKU stock for a visit (S2) — field_agent only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, items]
              properties:
                visitId: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [skuId, lastStockinDate]
                    properties:
                      skuId: { type: string }
                      unitsAvailable:
                        type: integer
                        nullable: true
                        description: >-
                          Units on the shelf, or null when this SKU was never counted (#389).
                          null and 0 are different findings: 0 is an agent at an empty shelf
                          and raises a stock-out task, while null is a SKU the agent has not
                          reached and raises nothing, leaving every availability ratio's
                          denominator instead. Omitting the field means the same as null.
                          Older clients always send an integer and are unaffected.
                      lastStockinDate: { type: string, format: date-time }
                      salesActual: { type: number, nullable: true }
                      salesTarget: { type: number, nullable: true }
      responses:
        '201':
          description: >-
            Stock rows created. daysOutOfStock and velocityAvg are derived server-side from
            the outlet's earlier history; coverageDaysPredicted is units/velocity and is
            therefore null exactly when unitsAvailable is null.
        '400':
          description: Missing visitId or a non-empty valid items[]
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit or a referenced SKU not found for this client
  /visibility:
    post:
      summary: Record visibility/display for a visit (S3-S4) — field_agent only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [visitId, brandingElements, planogramCompliancePct, facingsCount, highTrafficPass, cleanlinessScore]
              properties:
                visitId: { type: string }
                brandingElements: { type: object }
                planogramCompliancePct: { type: number }
                facingsCount: { type: object }
                highTrafficPass: { type: boolean }
                cleanlinessScore: { type: integer }
      responses:
        '201':
          description: Visibility upserted (one row per visit)
        '400':
          description: Missing or invalid required fields
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit not found for this client
  /pricing:
    post:
      summary: Record per-SKU shelf pricing for a visit (S5) — field_agent only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, items]
              properties:
                visitId: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [skuId, priceActual, promoActive, promoMaterialsDetected, commsRating]
                    properties:
                      skuId: { type: string }
                      priceActual:
                        type: number
                        description: Manual shelf-price entry (OCR-stub passthrough; real OCR is Phase 2, issue #2).
                      promoActive: { type: boolean }
                      promoMaterialsDetected: { type: object }
                      commsRating: { type: integer }
      responses:
        '201':
          description: Pricing rows created (priceMaster from Sku.rrp, deviationPct computed server-side)
        '400':
          description: Missing visitId or a non-empty valid items[]
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit or a referenced SKU not found for this client
  /competitive:
    post:
      summary: Record competitor observations for a visit (S6) — field_agent only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, items]
              properties:
                visitId: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [competitorSku, competitorPrice, competitorPosmType, competitorPromoterPresent, geotag]
                    properties:
                      competitorSku: { type: string }
                      competitorPrice: { type: number }
                      competitorPosmType: { type: string }
                      competitorPromoterPresent: { type: boolean }
                      geotag: { type: object }
      responses:
        '201':
          description: Competitive rows created
        '400':
          description: Missing visitId or a non-empty valid items[]
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit not found for this client
  /capability:
    post:
      summary: Record sales-team capability for a visit (S7) — field_agent only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, staffHeadcountConfirmed, repTrainingStatus, quizScore]
              properties:
                visitId: { type: string }
                staffHeadcountConfirmed: { type: integer }
                repTrainingStatus: { type: object }
                quizScore: { type: integer }
      responses:
        '201':
          description: Capability upserted (one row per visit)
        '400':
          description: Missing or invalid required fields
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit not found for this client
  /risks:
    post:
      summary: Flag risks for a visit (S8) — field_agent only; auto-creates SLA tasks
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, risks]
              properties:
                visitId: { type: string }
                risks:
                  type: array
                  items:
                    type: object
                    required: [flagType, severity, note]
                    properties:
                      flagType: { type: string }
                      severity: { type: string, enum: [critical, high, normal] }
                      note: { type: string }
      responses:
        '201':
          description: >
            Risk rows created, plus one auto-created Task per risk (owner = the
            visit's agent, slaDueAt from severity: critical=+24h, high=+3d,
            normal=+7d). Returns { risks, tasks }.
        '400':
          description: Missing visitId, empty risks[], or invalid severity
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit not found for this client
  /tasks:
    post:
      summary: Create a task manually (S9) — field_agent or manager
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId, findingType, requiredFix, priority]
              properties:
                outletId: { type: string }
                findingType: { type: string }
                requiredFix: { type: string }
                priority: { type: string, enum: [critical, high, normal] }
                visitId: { type: string }
                ownerId: { type: string, description: Defaults to the caller. }
      responses:
        '201':
          description: Task created (slaDueAt computed from priority)
        '400':
          description: Missing or invalid required fields
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent or manager
        '404':
          description: Outlet, visit, or owner not found for this client
    get:
      summary: List tasks for the caller's client, ordered by SLA due date
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, in_progress, closed] }
        - name: priority
          in: query
          schema: { type: string, enum: [critical, high, normal] }
        - name: outletId
          in: query
          schema: { type: string }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: '`nextCursor` from the previous page' }
      responses:
        '200':
          description: One page of tasks scoped to the caller's client
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor, total]
                properties:
                  data: { type: array, items: { type: object } }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer, description: Every task the filters match, ignoring the cursor — so a cut list can say how much it left out }
        '400':
          description: Invalid filter value
        '401':
          description: Missing or invalid token
  /tasks/{id}:
    patch:
      summary: Update task lifecycle (open → in_progress → closed) — field_agent or manager
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, in_progress, closed] }
                closurePhotoUrl: { type: string }
                closureVerified: { type: boolean, description: Manager only. }
      responses:
        '200':
          description: Task updated
        '400':
          description: Invalid body, or closing without a closure photo
        '401':
          description: Missing or invalid token
        '403':
          description: Role not permitted (closureVerified is manager-only)
        '404':
          description: Task not found for this client
  /scorecards:
    post:
      summary: Compute + persist the visit scorecard (S10) — field_agent only
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId]
              properties:
                visitId: { type: string }
                provisional:
                  type: object
                  description: >
                    The score the DEVICE showed the agent before this call (#390, #399).
                    OPTIONAL — an older app build sends `{ visitId }` alone and everything
                    works. Stored as provisionalTotal/provisionalBand/provisionalAt and
                    returned as `provisional`; NOTHING reads it as an input to any score,
                    KPI or aggregate. Write-once-ish: a REGENERATE that carries no
                    `provisional` leaves an existing one alone, because the server
                    recomputing its own number has learned nothing new about what the agent
                    was shown.
                  required: [weightedTotal, ratingBand]
                  properties:
                    weightedTotal: { type: number, minimum: 0, maximum: 100 }
                    ratingBand: { type: string, enum: [green, amber, red] }
                    computedAt:
                      type: string
                      format: date-time
                      description: The DEVICE clock when it showed that score. Omitted → `seenAt` is null.
      responses:
        '201':
          description: >
            Scorecard upserted (idempotent). Dimension scores computed from the
            visit's S2-S8 rows, weighted by Client.scorecardWeights; ratingBand
            from Client.kpiThresholds (defaults green>=80, amber>=60).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scorecard' }
        '400':
          description: Missing visitId, or a malformed provisional block
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a field_agent
        '404':
          description: Visit not found for this client
  /scorecards/{visitId}:
    get:
      summary: Fetch the scorecard for a visit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: visitId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The visit's scorecard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scorecard' }
        '401':
          description: Missing or invalid token
        '404':
          description: Visit or scorecard not found for this client
  /dashboard:
    get:
      summary: Manager KPI rollup — manager/admin only
      security: [{ bearerAuth: [] }]
      parameters:
        - name: territoryId
          in: query
          schema: { type: string }
        - name: outletId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: >
            { kpis: { numericDistribution, weightedDistribution, osaPct,
            executionScore, priceCompliancePct, visibilityCompliancePct,
            shareOfShelf, perfectStoreRate }, sampleSizes: { …the same eight
            keys… }, totals: { visits, outletsVisited, outletsTotal },
            scoreBands: [{ label, minScore, outlets }] }.
            scoreBands is the perfect-store distribution — always five bands,
            highest first (90–100, 80–89, 70–79, 60–69, <60) — counting each
            outlet once, at its most recent scored visit in scope.
            weightedDistribution and shareOfShelf are Phase-1 proxies (see
            module comments).


            `sampleSizes` (#387, #406) is ADDITIVE — `kpis` is unchanged in name
            and type, so an older client ignores it and behaves exactly as
            before. Each key is how many rows the KPI beside it was actually
            divided by, so the client can render the low-sample treatment: a
            tile reading 100% off two observations and one reading 100% off two
            thousand are otherwise identical. Each is the KPI's OWN denominator
            rather than a nearby proxy — `shareOfShelf` divides by facings, so
            its sample size is facings and not the row count of the captures.
            `osaPct` counts only stock lines that were COUNTED (#389). A value
            of `null` means the KPI is not a ratio over observations and has no
            denominator to report; it is never 0 for that case, because a client
            reading a missing sample size as 0 would mark every healthy tile as
            low-sample.


            There is no `baselineSampleSizes` here: this endpoint reports ONE
            window and returns no deltas, so there is no baseline that could be
            thin. The assistant's figures, which do compare windows, carry
            `baselineSampleSize` per figure.
        '400':
          description: Unparseable from/to date
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a manager/admin
  /photos:
    post:
      summary: Upload a photo (base64 data URL) — visit evidence or a message attachment
      description: >
        Phase-1 lean-infra storage (ADR 0007): the image is sent as a base64
        data URL and stored directly; real object storage is a later phase.


        Two shapes share this route. **Visit evidence** (no `purpose`) is
        field_agent only and requires visitId, section, dataUrl, gpsTag and
        timestamp. **A message attachment** (`purpose: message_attachment`,
        #125) is open to any role, takes no visitId, and must be an image that
        actually decodes — attachments are images only, there is no general
        file upload. It answers with metadata and links, not the bytes; pass its
        `id` in `POST /messages` `attachmentPhotoIds`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: VisitEvidence
                  required: [visitId, section, dataUrl, gpsTag, timestamp]
                  properties:
                    visitId: { type: string }
                    section: { type: string, description: 'e.g. s3_visibility, s5_pricing, task_closure' }
                    dataUrl: { type: string, description: 'base64 data URL, capped ~8MB' }
                    gpsTag: { type: object }
                    timestamp: { type: string, format: date-time }
                - type: object
                  title: MessageAttachment
                  required: [purpose, dataUrl]
                  properties:
                    purpose: { type: string, enum: [message_attachment] }
                    dataUrl: { type: string, description: 'base64 image data URL (data:image/*), capped ~8MB' }
                    gpsTag: { type: object, description: 'optional' }
                    timestamp: { type: string, format: date-time, description: 'optional; defaults to now' }
      responses:
        '201':
          description: >
            Photo stored. Visit evidence returns the stored row. A message
            attachment returns { id, clientId, uploadedById, section,
            timestamp, createdAt, thumbnailUrl, imageUrl } — no image bytes.
        '400':
          description: Missing/invalid fields, oversized dataUrl, unknown purpose, or a message attachment that is not a decodable image
        '401':
          description: Missing or invalid token
        '403':
          description: Visit evidence from a caller who is not a field_agent
        '404':
          description: Visit not found for this client
    get:
      summary: List a visit's photos
      security: [{ bearerAuth: [] }]
      parameters:
        - name: visitId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Photos for the visit (newest first)
        '400':
          description: Missing visitId
        '401':
          description: Missing or invalid token
        '404':
          description: Visit not found for this client
  /photos/{id}/thumbnail:
    get:
      summary: A photo's JPEG thumbnail (≤256px wide)
      description: >
        Visit evidence: any authenticated role in the visit's client. A message
        attachment (#125): the message's sender, its recipient (every user in
        the client, for a broadcast), the uploader, and the client's
        managers/admins. Anyone else gets 404, never 403, so an id is not an
        existence oracle.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: JPEG bytes (Cache-Control private, immutable)
          content: { image/jpeg: { schema: { type: string, format: binary } } }
        '401': { description: Missing or invalid token }
        '404': { description: Not found, or not readable by the caller }
        '422': { description: The stored photo is not a decodable image }
  /photos/{id}/image:
    get:
      summary: A photo's full-size image as raw bytes
      description: Same access rules as /photos/{id}/thumbnail.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Image bytes in their stored type, e.g. image/jpeg or image/png
          content: { image/*: { schema: { type: string, format: binary } } }
        '401': { description: Missing or invalid token }
        '404': { description: Not found, or not readable by the caller }
        '422': { description: The stored photo is not a base64 image data URL }
  # ── Phase 3 (Activation) ──────────────────────────────────────────────────
  # Full detail in docs/architecture/phase3-activation.md. All tenant-scoped
  # and role-guarded; responses summarised here.
  /territories:
    get:
      summary: List the client's territories
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Territories }, '401': { description: Unauthorized } }
    post:
      summary: Create a territory — manager/admin
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid }, '403': { description: Forbidden }, '409': { description: Duplicate code } }
  /territories/{id}/agents:
    post:
      summary: Assign an agent to a territory — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: Assigned }, '404': { description: Territory or user not found }, '409': { description: Already assigned } }
  /territories/{id}/coverage:
    get:
      summary: Outlets + assigned agents for a territory
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Coverage. Each assigned agent is a SafeUser (including displayName).
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/SafeUser' } }
        '404': { description: Not found }
  /campaigns:
    get:
      summary: List campaigns (with outlet counts)
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Campaigns } }
    post:
      summary: Create a campaign + assign outlets — manager/admin
      description: >-
        startDate and endDate are calendar dates (YYYY-MM-DD; a full ISO instant is
        read as its UTC date). The campaign window is inclusive of both dates in the
        client's timezone: from the start of startDate to the end of endDate, local.
        Compliance, order attribution and the ROI baseline all use that window.
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid }, '403': { description: Forbidden }, '404': { description: Outlet not found } }
  /campaigns/{id}:
    get:
      summary: Campaign + its outlets
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Campaign }, '404': { description: Not found } }
    patch:
      summary: Update campaign status/fields — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '403': { description: Forbidden }, '404': { description: Not found } }
  /campaigns/{id}/compliance:
    get:
      summary: Audit-derived compliance rollup — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Compliance rollup }, '404': { description: Not found } }
  /beatplans:
    get:
      summary: List beat plans (agent sees own; manager sees client's)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: agentId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [planned, in_progress, completed] } }
      responses: { '200': { description: Beat plans }, '400': { description: Invalid status } }
    post:
      summary: Create a beat plan with sequenced stops — manager/admin
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid }, '403': { description: Forbidden }, '404': { description: Agent/outlet/territory not found } }
  /beatplans/{id}:
    get:
      summary: Beat plan + stops + adherence
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Beat plan }, '404': { description: Not found } }
    patch:
      summary: Update beat-plan status — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '404': { description: Not found } }
  /beatplans/{id}/stops/{stopId}:
    patch:
      summary: Mark a stop visited — field_agent/manager
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: stopId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '404': { description: Not found } }
  /alerts/rules:
    get:
      summary: List alert rules
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Rules } }
    post:
      summary: Create an alert rule — manager/admin
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid metric }, '403': { description: Forbidden } }
  /alerts/rules/{id}:
    patch:
      summary: Update an alert rule — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '404': { description: Not found } }
  /alerts/evaluate:
    post:
      summary: Evaluate a visit against active rules → Alerts — manager/admin
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: 'Created alerts (may be empty)' }, '400': { description: Missing visitId }, '404': { description: Visit not found } }
  /alerts:
    get:
      summary: List alerts (filter acknowledged/severity)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: acknowledged, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: '`nextCursor` from the previous page' }
      responses:
        '200':
          description: One page of alerts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor, total]
                properties:
                  data: { type: array, items: { type: object } }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer, description: Every alert the filters match, ignoring the cursor — so a cut list can say how much it left out }
  /alerts/{id}/ack:
    patch:
      summary: Acknowledge an alert — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Acknowledged }, '404': { description: Not found } }
  /templates:
    get:
      summary: List audit templates (active; ?includeInactive=true for all)
      security: [{ bearerAuth: [] }]
      parameters: [{ name: includeInactive, in: query, schema: { type: boolean } }]
      responses: { '200': { description: Templates } }
    post:
      summary: Create an audit template — manager/admin
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Created }, '400': { description: Invalid }, '403': { description: Forbidden } }
  /templates/selected:
    get:
      summary: The client's audit template — any role (#122)
      description: >
        The template whose questions field agents answer on every visit, as an
        extra "client questions" section after the fixed S1–S10. It supplements
        those sections and never feeds the perfect-store score. `template` is
        null when the client uses none; a paused template is never returned.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The selected template (with its schema), or null
          content:
            application/json:
              schema:
                type: object
                required: [template]
                properties:
                  template:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/AuditTemplate' }]
        '401': { description: Missing or invalid token }
    put:
      summary: Set or clear the client's audit template — manager/admin (#122)
      description: >
        Only one of the caller's client's own, active templates can be chosen.
        Another client's template is a 404. Pass `templateId: null` to stop
        using a template in audits. Pausing a template (PATCH active=false)
        also clears it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId]
              properties:
                templateId: { type: string, nullable: true }
      responses:
        '200':
          description: The template now in use, or null when cleared
          content:
            application/json:
              schema:
                type: object
                required: [template]
                properties:
                  template:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/AuditTemplate' }]
        '400': { description: templateId missing or not a string/null, or the template is paused }
        '403': { description: Caller is not a manager/admin }
        '404': { description: Template not found for this client }
  /template-responses:
    post:
      summary: Record a visit's answers to a template (upsert per visit+template) — field_agent
      description: >
        Answers are keyed by the schema's field ids. Re-posting overwrites the
        answers. `templateVersion` is the version the agent's device rendered;
        when omitted the template's current version is recorded. The visit must
        be the caller's own; the template must belong to the caller's client.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitId, templateId, answers]
              properties:
                visitId: { type: string }
                templateId: { type: string }
                answers: { type: object, additionalProperties: true }
                templateVersion: { type: integer, minimum: 1 }
      responses:
        '201': { description: The stored response, with templateVersion }
        '400': { description: Invalid body, or templateVersion newer than the template }
        '403': { description: Caller is not a field_agent }
        '404': { description: Visit (of this agent) or template (of this client) not found }
    get:
      summary: List a visit's template responses — tenant-scoped
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: visitId, in: query, required: true, schema: { type: string } }
        - { name: templateId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { '200': { description: '{ data, nextCursor }' }, '400': { description: Missing visitId }, '404': { description: Visit not found } }
  /templates/{id}:
    get:
      summary: Fetch a template
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Template }, '404': { description: Not found } }
    patch:
      summary: Update a template (schema change bumps version) — manager/admin
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Updated }, '400': { description: Invalid }, '404': { description: Not found } }
  /trends/scorecards:
