  /contests:
    get:
      summary: List the client's contests, cancelled ones included — manager/admin
      description: Newest start date first, keyset-paginated. Status is computed on read.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of contests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Contest' } }
                  nextCursor: { type: string, nullable: true }
        '400': { description: Invalid pagination }
        '403': { description: Forbidden }
    post:
      summary: Create a contest — manager/admin
      description: >-
        startDate and endDate are calendar dates (strictly YYYY-MM-DD), inclusive,
