name: tradeiq_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Field-app localisation (#40): gen-l10n ARB messages plus the Material
  # widgets' own translations; `intl` formats dates in the active locale.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  animations: ^2.0.11
  flutter_riverpod: ^3.3.2
  dio: ^5.10.0
  drift: ^2.34.0
  path_provider: ^2.1.6
  path: ^1.9.1
  geolocator: ^14.0.3
  uuid: ^4.5.3
  flutter_secure_storage: ^10.3.1
  drift_flutter: ^0.3.0
  video_player: ^2.11.1
  # Camera + gallery capture for closure and section photos (#41). Works on
  # mobile and web, which matters because the same codebase serves both.
  image_picker: ^1.1.2
  # Picking a .csv off the manager's disk for the sales-target import (#339).
  # Federated like image_picker above, so the same call works on web (bytes,
  # no path — the browser never hands one out), desktop and mobile.
  file_picker: ^13.1.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # On-demand PDF export of the artifact the user is looking at (Phase 2).
  # `pdf` builds the document, `printing` hands it to the platform's own
  # share/print sheet — the viewer is the OS's, not one we maintain. Not to be
  # confused with /reports and /report-schedules, which are server-side and
  # cannot reuse Flutter's CustomPainter charts.
  pdf: ^3.11.1
  printing: ^5.13.4
  sqlite3: ^3.5.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # Opening a cited web source (Ask TradeIQ `webSearch`) in the platform's
  # own browser, never an in-app web view.
  url_launcher: ^6.3.2
  # Saving a server-generated CSV where the manager asked for it (#390). Web
  # only: the conditional import in `core/download/` reaches for it behind
  # `dart.library.js_interop`, and every other platform writes a real file
  # through path_provider. Declared because a transitive dependency is not a
  # dependency you may import.
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Runs gen-l10n (config in l10n.yaml) on pub get / build / test.
  generate: true

  assets:
    - assets/images/tradeiq-ti-monogram.png
    - assets/videos/Steadycam_gliding_down_aisle_202607102247.mp4
    # Onest for the PDF exporter, and ONLY for it — declared as assets rather
    # than under `fonts:` so the engine never resolves a screen to them.
    # `package:pdf` parses a TTF's `glyf` outlines directly and knows nothing
    # about a variable font's `gvar` deltas, so handing it Onest-Variable three
    # times would render every weight at 400 and silently flatten the report's
    # hierarchy. These are static instances at wght 400/500/700, subset to
    # Latin + Latin-Ext plus the punctuation and currency the app emits: 50 KB
    # each against 1.25 MB of Inter. Regenerate with tool/build_pdf_fonts.sh.
    - assets/fonts/Onest-Pdf-400.ttf
    - assets/fonts/Onest-Pdf-500.ttf
    - assets/fonts/Onest-Pdf-700.ttf

  # Fonts are bundled, not fetched: field agents work offline in shops with no
  # signal, so a runtime download (the google_fonts default) would mean the
  # theme's typeface — whose metrics every letterSpacing and font-size token
  # was tuned against — simply isn't there.
  #
  # Onest is the Torchlight Aisle prose face, shipped as the single VARIABLE
  # font Google Fonts publishes (wght 100–900, no italic). One asset, not four
  # static instances: Flutter has mapped FontWeight onto a variable font's wght
  # axis since 3.41 and this app is on 3.44.8, so the old note here about
  # Flutter only resolving distinct files is out of date. 193 KB replaces
  # Inter's 1.67 MB. Filename has no brackets on purpose: the generated
  # FontManifest URL-escapes them and an asset key stops round-tripping. SIL OFL 1.1 — licence at assets/fonts/OFL-Onest.txt.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf

    # JetBrains Mono — the FIGURE and IDENTIFIER face, and the reason Onest is
    # never allowed to render one. Onest has no slashed zero, its digits are
    # proportional unless `tnum` is switched on, and its capital I and
    # lowercase l are the same shape — all fine for prose and disqualifying for
    # an outlet code, a GTIN or an order ref. The split is enforced by
    # test/core/theme/torchlight/torchlight_type_test.dart, not by discipline.
    # SIL OFL 1.1 — licence at assets/fonts/OFL-JetBrainsMono.txt.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
