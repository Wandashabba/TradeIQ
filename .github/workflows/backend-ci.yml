name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # Nothing verified main after a merge: a PR could go green, land, and
  # break on main with no signal at all. Same paths, so it stays quiet
  # for changes that cannot affect this job.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradeiq
          POSTGRES_PASSWORD: tradeiq_dev
          POSTGRES_DB: tradeiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tradeiq:tradeiq_dev@localhost:5432/tradeiq?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      # Fails the build on a high/critical advisory in a shipped dependency.
      # Currently clean, so it starts as a ratchet rather than noise.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test
