name: backend-ci

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  # Nothing verified main after a merge: a PR could go green, land, and
  # break on main with no signal at all. Same paths, so it stays quiet
  # for changes that cannot affect this job.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradeiq
          POSTGRES_PASSWORD: tradeiq_dev
          POSTGRES_DB: tradeiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tradeiq:tradeiq_dev@localhost:5432/tradeiq?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      # `build` only typechecks src/. `typecheck` also covers scripts/ via
      # tsconfig.scripts.json, so a broken seed script cannot reach main.
      - run: npm run typecheck
      - run: npm run build
      # Serial on purpose. jest.config.js caps workers at 4 for developer
      # machines, but a shared runner still exhausts the Prisma connection
      # pool (#181), which surfaces as a wall of unrelated suite failures.
      # #186's per-worker databases made parallel *correct*, not *safe here*.
      - run: npx jest --runInBand

  # A separate job, deliberately.
  #
  # This used to be a step inside `test`, sitting between `npm ci` and every
  # correctness check. Steps run sequentially and a failure ends the job, so
  # when advisories landed against undici, brace-expansion and ip-address, lint,
  # typecheck, build and all 912 tests were skipped — for every backend PR,
  # silently. A red X still appeared, so nothing looked wrong; the signal that
  # vanished was the one nobody thinks to check for absence.
  #
  # A supply-chain advisory and a broken test are independent facts and neither
  # should be able to hide the other. Split out, both always report. The audit
  # stays blocking: it is a ratchet, not a warning.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      # Fails on a high/critical advisory in any dependency.
      - run: npm audit --audit-level=high
