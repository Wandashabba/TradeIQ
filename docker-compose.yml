services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeiq
      POSTGRES_PASSWORD: tradeiq_dev
      POSTGRES_DB: tradeiq
    ports:
      - "5432:5432"
    volumes:
      - tradeiq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tradeiq_pg_data:
