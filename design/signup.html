<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeIQ — Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter','sans-serif'], heading: ['Montserrat','sans-serif'] },
                colors: { tradeDark:'#0f1117', tradeCard:'#1a1d24', tradeInput:'#262a33', tradeBlue:'#0052cc', tradeBlueLight:'#007aff', tradeBlueDark:'#003399' },
                backgroundImage: { 'blue-gradient':'linear-gradient(135deg, #007aff 0%, #003399 100%)' }
            }}
        }
    </script>
    <style>
        body { background-color:#050505; background-image: radial-gradient(circle at 50% 0%, #1a2235 0%, #050505 70%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; color:white; }
        .phone-frame { width:375px; height:812px; background-color:#0f1117; border-radius:45px; box-shadow:0 0 0 10px #1f232e, 0 30px 60px rgba(0,0,0,0.5), 0 0 100px rgba(0,82,204,0.15); position:relative; overflow:hidden; }
        .notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:30px; background-color:#1f232e; border-bottom-left-radius:20px; border-bottom-right-radius:20px; z-index:50; }
        .ti-logo-container { position:relative; display:inline-flex; justify-content:center; align-items:center; filter:drop-shadow(0 8px 12px rgba(0,51,153,0.4)); }
        .custom-input:focus { outline:none; border-color:#007aff; box-shadow:0 0 0 2px rgba(0,122,255,0.2); }
        .no-scrollbar::-webkit-scrollbar { display:none; }
        .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        .role-chip input:checked + div { border-color:#007aff; background:rgba(0,122,255,0.12); }
        .role-chip input:checked + div .role-icon { color:#007aff; }
    </style>
</head>
<body>
    <div class="phone-frame bg-tradeDark flex flex-col">
        <div class="notch"></div>

        <!-- Status Bar -->
        <div class="absolute top-0 w-full h-12 flex justify-between items-center px-6 text-xs font-medium z-40">
            <span>9:41</span>
            <div class="flex gap-2 items-center"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
        </div>

        <!-- Header -->
        <div class="pt-16 px-6 flex items-center mb-4">
            <a href="signin.html" class="text-gray-400 hover:text-white transition-colors p-2 -ml-2"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="flex-1 flex justify-center items-center gap-2 -ml-4">
                <div class="ti-logo-container w-9 h-9">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <path d="M10 30 C 30 10, 70 10, 90 30 L 80 40 L 60 40 L 60 90 C 60 100, 40 100, 35 90 L 35 40 L 20 40 Z" fill="url(#su1)"/>
                        <path d="M65 40 L 85 40 L 85 90 C 85 100, 65 100, 60 90 Z" fill="url(#su2)"/>
                        <defs>
                            <linearGradient id="su1" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#33ccff"/><stop offset="1" stop-color="#002266"/></linearGradient>
                            <linearGradient id="su2" x1="65" y1="40" x2="85" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#0088ff"/><stop offset="1" stop-color="#003399"/></linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="font-heading font-bold text-xl tracking-wide">TradeIQ</span>
            </div>
        </div>

        <!-- Card (scrollable) -->
        <div class="flex-1 bg-tradeCard rounded-t-[40px] flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.3)] overflow-hidden">
            <div class="overflow-y-auto no-scrollbar px-6 pt-8 pb-8 flex-1">
                <div class="mb-6">
                    <h2 class="font-heading text-2xl font-bold">Create Account</h2>
                    <p class="text-sm text-gray-400 mt-1">Join TradeIQ field intelligence.</p>
                </div>

                <form class="space-y-4" onsubmit="return false;">
                    <!-- Full name -->
                    <div class="space-y-2">
                        <label class="text-sm text-gray-400 font-medium px-1">Full name</label>
                        <div class="relative flex items-center">
                            <i class="fa-regular fa-user absolute left-4 text-gray-500 text-sm"></i>
                            <input type="text" placeholder="Jordan Mokoena" class="custom-input w-full bg-tradeInput text-white rounded-2xl pl-11 pr-4 py-3.5 text-sm border border-transparent transition-all placeholder-gray-500">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="space-y-2">
                        <label class="text-sm text-gray-400 font-medium px-1">Email</label>
                        <div class="relative flex items-center">
                            <i class="fa-regular fa-envelope absolute left-4 text-gray-500 text-sm"></i>
                            <input type="email" placeholder="you@company.com" class="custom-input w-full bg-tradeInput text-white rounded-2xl pl-11 pr-4 py-3.5 text-sm border border-transparent transition-all placeholder-gray-500">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="space-y-2">
                        <label class="text-sm text-gray-400 font-medium px-1">Password</label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-lock absolute left-4 text-gray-500 text-sm"></i>
                            <input id="pw" type="password" placeholder="Create a password" class="custom-input w-full bg-tradeInput text-white rounded-2xl pl-11 pr-12 py-3.5 text-sm border border-transparent transition-all placeholder-gray-500">
                            <button type="button" onclick="togglePw('pw', this)" class="absolute right-4 text-gray-500 hover:text-white transition-colors"><i class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>

                    <!-- Confirm password -->
                    <div class="space-y-2">
                        <label class="text-sm text-gray-400 font-medium px-1">Confirm password</label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-lock absolute left-4 text-gray-500 text-sm"></i>
                            <input id="pw2" type="password" placeholder="Re-enter your password" class="custom-input w-full bg-tradeInput text-white rounded-2xl pl-11 pr-12 py-3.5 text-sm border border-transparent transition-all placeholder-gray-500">
                            <button type="button" onclick="togglePw('pw2', this)" class="absolute right-4 text-gray-500 hover:text-white transition-colors"><i class="fa-regular fa-eye"></i></button>
                        </div>
                    </div>

                    <!-- Role selector -->
                    <div class="space-y-2">
                        <label class="text-sm text-gray-400 font-medium px-1">Your role</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="role-chip cursor-pointer">
                                <input type="radio" name="role" value="field_agent" class="hidden" checked>
                                <div class="flex items-center gap-3 bg-tradeInput border border-transparent rounded-2xl px-4 py-3 transition-all">
                                    <i class="fa-solid fa-person-walking role-icon text-gray-400"></i>
                                    <span class="text-sm font-medium">Field Agent</span>
                                </div>
                            </label>
                            <label class="role-chip cursor-pointer">
                                <input type="radio" name="role" value="manager" class="hidden">
                                <div class="flex items-center gap-3 bg-tradeInput border border-transparent rounded-2xl px-4 py-3 transition-all">
                                    <i class="fa-solid fa-user-tie role-icon text-gray-400"></i>
                                    <span class="text-sm font-medium">Manager</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Terms -->
                    <label class="flex items-start gap-2 text-xs text-gray-400 cursor-pointer select-none pt-1">
                        <input type="checkbox" class="accent-tradeBlueLight w-4 h-4 rounded mt-0.5">
                        <span>I agree to the <a href="#" class="text-tradeBlueLight font-medium">Terms of Service</a> and <a href="#" class="text-tradeBlueLight font-medium">Privacy Policy</a>.</span>
                    </label>

                    <div class="pt-2">
                        <button type="submit" class="w-full bg-blue-gradient text-white font-semibold py-4 rounded-full shadow-lg shadow-blue-900/40 hover:opacity-90 active:scale-[0.98] transition-all">Create Account</button>
                    </div>
                </form>

                <div class="pt-5 text-center text-sm">
                    <span class="text-gray-500">Already have an account? </span>
                    <a href="signin.html" class="text-tradeBlueLight hover:text-blue-400 font-semibold transition-colors">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePw(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        }
    </script>
</body>
</html>
