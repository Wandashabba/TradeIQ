<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeIQ — Landing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans: ['Inter','sans-serif'], heading: ['Montserrat','sans-serif'] },
                colors: { tradeDark:'#0f1117', tradeCard:'#1a1d24', tradeInput:'#262a33', tradeBlue:'#0052cc', tradeBlueLight:'#007aff', tradeBlueDark:'#003399' },
                backgroundImage: { 'blue-gradient':'linear-gradient(135deg, #007aff 0%, #003399 100%)' }
            }}
        }
    </script>
    <style>
        body { background-color:#050505; background-image: radial-gradient(circle at 50% 0%, #1a2235 0%, #050505 70%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; color:white; }
        .phone-frame { width:375px; height:812px; background-color:#0f1117; border-radius:45px; box-shadow:0 0 0 10px #1f232e, 0 30px 60px rgba(0,0,0,0.5), 0 0 100px rgba(0,82,204,0.15); position:relative; overflow:hidden; }
        .notch { position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:30px; background-color:#1f232e; border-bottom-left-radius:20px; border-bottom-right-radius:20px; z-index:50; }
        .ti-logo-container { position:relative; display:inline-flex; justify-content:center; align-items:center; filter:drop-shadow(0 10px 15px rgba(0,51,153,0.4)); }
    </style>
</head>
<body>
    <div class="phone-frame flex flex-col justify-between">
        <div class="notch"></div>

        <!-- Status Bar -->
        <div class="absolute top-0 w-full h-12 flex justify-between items-center px-6 text-xs font-medium z-40">
            <span>9:41</span>
            <div class="flex gap-2 items-center"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
        </div>

        <!-- Hero background -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1578916171728-46686eac8d58?q=80&w=800&auto=format&fit=crop" alt="Retail aisle" class="w-full h-full object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-b from-tradeDark/30 via-tradeDark/80 to-tradeDark"></div>
        </div>

        <!-- Top: logo + wordmark -->
        <div class="relative z-10 pt-16 px-6 flex flex-col items-center">
            <div class="mt-6 flex flex-col items-center">
                <div class="ti-logo-container w-24 h-24 mb-3">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <path d="M10 30 C 30 10, 70 10, 90 30 L 80 40 L 60 40 L 60 90 C 60 100, 40 100, 35 90 L 35 40 L 20 40 Z" fill="url(#lg1)"/>
                        <path d="M65 40 L 85 40 L 85 90 C 85 100, 65 100, 60 90 Z" fill="url(#lg2)"/>
                        <defs>
                            <linearGradient id="lg1" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="#33ccff"/><stop offset="0.5" stop-color="#0066cc"/><stop offset="1" stop-color="#002266"/></linearGradient>
                            <linearGradient id="lg2" x1="65" y1="40" x2="85" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#0088ff"/><stop offset="1" stop-color="#003399"/></linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1 class="font-heading text-2xl font-bold tracking-wide drop-shadow-md">TradeIQ</h1>
            </div>
        </div>

        <!-- Middle / CTA -->
        <div class="relative z-10 px-6 flex flex-col items-center text-center mt-auto mb-10">
            <h2 class="font-heading text-4xl font-extrabold leading-tight mb-4 tracking-tight drop-shadow-lg">DOMINATE<br>YOUR<br>MARKET.</h2>
            <p class="text-gray-300 text-sm leading-relaxed mb-4 max-w-xs font-light">The premium field-execution and order-management platform. Flawless control and real-time insight for leading brands.</p>
            <div class="flex items-center gap-2 text-sm text-blue-400 font-medium mb-8 bg-tradeDark/50 px-4 py-2 rounded-full border border-blue-900/30">
                <div class="w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)]"></div>
                Real-time field intelligence
            </div>

            <!-- Page dots -->
            <div class="flex gap-2 mb-8">
                <div class="w-6 h-1.5 rounded-full bg-tradeBlueLight"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>
            </div>

            <a href="signup.html" class="w-full bg-blue-gradient text-white font-semibold py-4 rounded-full shadow-lg shadow-blue-900/50 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Get Started <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
            <p class="mt-5 text-sm text-gray-400">Already have an account?
                <a href="signin.html" class="text-tradeBlueLight hover:text-blue-400 font-semibold transition-colors">Sign In</a>
            </p>
        </div>
    </div>
</body>
</html>
